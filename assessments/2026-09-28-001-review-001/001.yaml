gaps:
- Выбор реляционной БД обоснован только объёмом данных; паттерны запросов, требование
  атомарного запрета пересечений и эксплуатационные ограничения не были названы как
  исходные критерии.
- Пользователь оставил оба предложенных индекса броней без разграничения необходимых
  запросов и дополнительной цены второго индекса.
- WHERE NOT EXISTS под обычной изоляцией не обеспечивает запрет пересекающихся броней
  при параллельных вставках; оба запроса могут пройти проверку до записи другого.
summary: 'Пользователь назвал разумные ключи, предложил реляционное хранилище и самостоятельно
  обозначил стоимость индексов и P99 как сигнал пересмотра. Выбор минимального набора
  индексов остался необоснованным. Главный инвариант конкурентного бронирования не
  обеспечен: после уточнения пользователь по-прежнему считал, что WHERE NOT EXISTS
  заставит второй одновременный запрос увидеть первую ещё не подтверждённую запись.'
