gaps:
- Утверждение «при синхронной репликации данные не потеряются при падении leader»
  дано без оговорки, что гарантия зависит от выбора нового leader среди подтвердивших
  узлов.
- Lag определён только как задержка доставки на реплику; отставание применения изменений
  на follower отдельно не названо, хотя различие журнала и применения объяснено во
  втором ответе.
- В цене решения не учтена дополнительная нагрузка на leader от чтений «Моих билетов»
  после покупки.
summary: Пользователь самостоятельно и корректно объяснил асинхронное и синхронное
  подтверждение, разницу между записью в журнал и видимостью в чтении, lag с примером
  read-after-write и отличие реплик от резервной копии. В сценарии выбрал обоснованный
  режим подтверждения и маршруты чтений, описал failover с перерывом и защитой от
  старого leader и назвал цену. Неточности второстепенные и не мешают применению.
