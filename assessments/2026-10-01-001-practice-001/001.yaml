gaps:
- Цена каждого выделенного сервиса, явно запрошенная в задании, появилась только после
  уточнения, а вопрос об избыточности пяти сервисов при двух командах остался без
  решения.
- Идемпотентность webhook названа без конкретного ключа и без правила для позднего
  события; связь кэшируемой даты истечения с grace period не учтена.
- Защита от двойного сертификата (уникальный индекс и сборка неподтверждённых файлов)
  сформулирована только после целевого уточнения.
summary: Пользователь самостоятельно предложил разумную декомпозицию с владельцами
  данных, отдельной аналитической БД и деградацией проверки доступа через кэш, а также
  осознанно оставил администрирование курсов модулем. Однако цена сервисных границ
  и обработка отказных случаев сертификата появились только после уточнения, а механизм
  идемпотентности webhook и решение о числе сервисов остались неполными. Применение
  улучшилось по сравнению с прошлой попыткой, но пока требует подсказок.
