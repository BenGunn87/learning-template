gaps:
- Для чата выбран consistent prefix вместе со слиянием независимых записей после разделения;
  причинная согласованность не была предложена, а упорядочивание по времени отправки
  не учитывает расхождение часов.
- Для баланса игрока не предложена маршрутизация к домашнему лидеру; read-your-writes
  рассматривался как замена линеаризуемой проверке инварианта баланса.
- Поведение при разделении сначала описано обобщённо («отказывает») без указания,
  какая сторона продолжает работать.
summary: Пользователь своими словами воспроизвёл основные модели согласованности,
  CAP и PACELC и объяснил причины нарушения read-your-writes и цену линеаризуемой
  записи. В практике верно разделил ник и аватар по гарантиям, после уточнения предложил
  квоты регионов для лимитированного предмета и заранее выбранного лидера для ников.
  Выбор модели для чата и для баланса игрока показал неточное различение порядковых
  и сессионных гарантий и инвариантов, поэтому применение требует практики.
