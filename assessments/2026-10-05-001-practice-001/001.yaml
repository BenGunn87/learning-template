gaps:
- Защита от двойной брони изначально опиралась только на Redis-лок; гарантия на уровне
  БД (слоты с уникальным индексом по столику и слоту) появилась только после уточнения
  и с неуверенностью.
- Цена отдельных сервисов в первоначальном ответе названа обобщённо; решение не выделять
  оповещения и статистику при команде из пяти человек и распределённая транзакция
  бронь–POS–оплата появились только после уточнения, без конкретного механизма (outbox/сага
  с компенсациями).
- Ключ идемпотентности callback — id брони — не различает разные события провайдера
  по одной брони (успех после неудачи, повторная попытка оплаты).
summary: Заметный прогресс по сравнению с прошлой практикой — все четыре пункта закрыты
  сразу, правило для поздней оплаты конкретное (проверить свободен ли столик, иначе
  вернуть депозит), у оставленной модулем границы назван сигнал выделения, при конфликте
  с POS предложена понятная компенсация. Однако ключевая гарантия согласованности
  (ограничение в БД против двойной брони) и честная оценка цены пяти сервисов при
  одной команде появились только после целевых уточнений, поэтому применение пока
  остаётся hard.
