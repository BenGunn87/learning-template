gaps:
- Для обмена на билет не зафиксирована запись exchange (pending) до списания и вызова
  партнёра и собственный ключ идемпотентности; идемпотентность API партнёра принята
  как неявное допущение, проверка статуса после таймаута не предложена.
- Офлайн-лимит опирается на баланс из мобильного клиента без механизма доверия; уход
  в минус предлагается закрывать обнулением баланса вместо явной операции списания
  в истории, что исказит отчёт по обязательствам.
- Цена выделения названа только для пары баллы/билеты; операционная стоимость отдельного
  push-сервиса для команды из трёх человек не учтена.
summary: Явный прогресс по сравнению с двумя прошлыми практиками — гарантии на уровне
  БД (UUID операции от кассы, уникальный ключ в истории, атомарность баланса и истории,
  пессимистичная блокировка) и честное различие онлайн/офлайн-пути появились сразу
  без подсказок, отчёты оставлены модулем с сигналом выделения. Механизм обмена на
  билет и оценка цены сервисов ещё неполные, но декомпозиция самостоятельно применима,
  поэтому application — good.
