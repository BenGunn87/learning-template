gaps:
- 'Индекс для отчёта «активации кампании за период по дням» не выведен из запроса:
  (starts_at, ends_at) на campaign его не обслуживает, после уточнения индекс не назван;
  нужен (campaign_id, activated_at) на таблице активаций с денормализованным campaign_id.'
- Индекс по code не объявлен уникальным, хотя code — естественный ключ поиска промокода.
- 'Цена горячей строки счётчика не раскрыта: при 5 000/с на одну строку условные UPDATE
  сериализуются на row lock, растут очередь, латентность и таймауты; способ смягчения
  (шардированный счётчик, предраспределение лимита по бакетам, резервирование вне
  БД) не предложен.'
- 'Сигнал пересмотра не измерим: нет конкретной метрики и порога (например, p99 активации
  или время ожидания блокировки на строке счётчика).'
- Выбор хранилища обоснован общим ACID; отвергнутая альтернатива названа без конкретного
  механизма (атомарный декремент в key-value тоже возможен).
summary: 'Сильная сторона: после уточнения пользователь самостоятельно построил корректный
  механизм на уровне БД — отдельная строка-счётчик с условным UPDATE (current_limit
  >= 1), вставка активации в той же транзакции, уникальный (user_id, promocode_id)
  для однократности и атомарный возврат лимита при отмене. Это заметный прогресс относительно
  прошлого WHERE NOT EXISTS. Слабые места: индекс отчёта не выведен из запроса, цена
  горячей строки и смягчение при пике не раскрыты, сигнал пересмотра без метрики и
  порога. Recall и understanding перенесены из Review 2026-09-28 и не перепроверялись.'
