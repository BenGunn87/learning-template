gaps:
- Первоначально выбран режим ожидания обоих followers, нарушающий требование работы
  при отказе одной AZ; кворум 1 из 2 предложен только после уточнения — повтор слабости
  прошлой Review.
- Нет правила выбора нового leader при кворуме 1 из 2 (follower с наибольшей позицией
  журнала); ошибочно предположено, что followers могут иметь взаимно отсутствующие
  записи и их надо объединять, хотя оба получают префиксы одного упорядоченного журнала
  leader.
- Решающая сторона failover названа расплывчато (координатор), без кворума/консенсуса
  при выборе.
summary: Маршруты чтений выбраны верно и самостоятельно; после уточнения появились
  кворумное подтверждение 1 из 2 и номер эпохи leader, по которому реплики отклоняют
  записи старого leader, — заметный прогресс по сравнению с прошлой попыткой. Но исходная
  схема нарушала требование доступности, а выбор нового leader не построен из-за неверной
  модели журнала у followers — application остаётся hard.
