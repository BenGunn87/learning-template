summary: 'Заметный прогресс по подтверждённому Gap: без уточнений и подсказок пользователь
  сам выбрал кворумное подтверждение, исключающее потерю при отказе ДЦ (понимая, что
  F1 в том же ДЦ не защищает), выбрал нового leader по наибольшей позиции журнала,
  обосновал внешнего координатора отсутствием большинства (2 из 4) и правильно развёл
  маршруты чтений. Это ровно те места, где в двух прошлых попытках требовались подсказки.
  Ответы краткие: fencing через эпоху, цена кворума по задержке и догон F3 не раскрыты
  — уточнения, а не ошибки модели. Recall и understanding перенесены из 2026-10-14
  и не перепроверялись.'
