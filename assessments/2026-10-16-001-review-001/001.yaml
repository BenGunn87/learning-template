gaps:
- 'Владелец данных реестра не определён: сервис отчётности «работает с отдельной репликой»,
  но реестру нужны данные двух сервисов (записи и заключения); чтение чужих реплик
  связывает его со схемами других сервисов. Альтернатива (события/выгрузка в собственное
  хранилище отчётов) появилась только в выводах после обратной связи.'
- В B не названо, что при двух писателях никто целиком не гарантирует инварианты данных.
- Размещение заключений в сервисе пациентов не обосновано; защита слота от одновременной
  записи из двух каналов не проговорена (явно не спрашивалась).
summary: 'Без подсказок и уточнений пользователь назвал три рабочих критерия границ
  (атомарность над данными, общие причины изменений, профиль нагрузки), объяснил ценность
  единственного владельца данных и построил минимальную декомпозицию на три сервиса
  с разумными sync/async потоками и осознанно отложенным выделением уведомлений с
  конкретным сигналом. Слабое место — источник данных для кросс-сервисного отчёта:
  реплика вместо собственной проекции через события. Это уточнение, а не фундаментальная
  ошибка; уровень стабильно good по всем измерениям.'
