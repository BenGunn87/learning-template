format_version: 1

goal:
  why: professional-growth
  outcome: >
    Сначала сформировать целостное представление о System Design,
    затем научиться проектировать backend-системы и аргументировать
    архитектурные решения и компромиссы.

experience:
  level: intermediate
  notes: Есть опыт backend-разработки, включая API, базы данных и базовую инфраструктуру.

depth: working

constraints:
  default_session_minutes: 25

preferences:
  languages:
    - ru
    - en
  resources:
    - article
    - documentation
    - video

diagnostic:
  status: completed
  completed_at: 2026-09-14
  summary: >
    Уверенно распознаёт базовые архитектурные решения и типовые отказные
    сценарии. Начальный маршрут может быстро пройти обзор основ и перейти
    к системному анализу требований и практическим компромиссам.
  areas:
    - area: performance-and-scalability
      level: strong
      notes: Выбрал измерение системы и поиск узкого места до масштабирования.
    - area: data-storage-and-transactions
      level: strong
      notes: Связал реляционную БД с транзакциями и ограничениями целостности.
    - area: caching-and-load-protection
      level: strong
      notes: Распознал cache stampede и single-flight/stale-value mitigation.
    - area: replication-and-consistency
      level: strong
      notes: Понимает риск потери подтверждённой записи при асинхронной репликации.
