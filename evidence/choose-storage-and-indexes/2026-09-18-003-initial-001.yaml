recall:
  prompts:
  - 1. Какие четыре группы ограничений нужно выяснить до выбора класса основного хранилища
    и как каждая из них влияет на решение? 2. Для какого запроса полезен составной
    B-tree индекс (tenant_id, status, created_at DESC), почему поля стоят именно в
    таком порядке и какой запрос использует его существенно хуже? 3. Назовите минимум
    три цены дополнительного индекса и объясните, когда от него разумнее отказаться.
  - Дополните влияние масштаба и эксплуатационных ограничений. Почему created_at стоит
    после tenant_id и status и как индекс работает для tenant_id + created_at без
    status?
  answers:
  - До выбора хранилища нужно проанализировать чтение и запись и их соотношение, атомарно
    изменяемые данные и гибкость схемы. Индекс полезен для запросов по tenant_id,
    tenant_id + status и полному префиксу с created_at; без tenant_id, например только
    по status, он используется хуже. Цена индекса — замедление добавления, изменения
    и удаления, дополнительное место и память, усложнение работы планировщика; от
    редко используемого индекса со слабым ускорением можно отказаться.
  - От масштаба зависит, требуется ли распределённое хранилище или всё помещается
    на одном сервере. Эксплуатационные ограничения показывают, есть ли у команды экспертиза
    и техническая возможность работать с выбранным хранилищем. created_at в конце
    поддерживает временной диапазон; без status индекс сузит выборку по tenant_id,
    после чего потребуется перебрать его оставшиеся записи.
practice:
  prompt: 'Спроектируйте сервис складских остатков: для пары (warehouse_id, sku) хранится
    доступное количество; нужно читать остаток по ключу, атомарно резервировать несколько
    SKU без отрицательного остатка, показывать дефицитные товары склада по available_qty
    и читать историю SKU за 30 дней в обратном порядке. Пик — 3000 изменений/с, данные
    региона помещаются на один сервер, команда уверенно работает с PostgreSQL. Выберите
    хранилище, ключи и минимальные индексы; объясните атомарность, отвергнутую альтернативу,
    цену индексов и измеримый сигнал пересмотра. После первоначального ответа требовалось
    уточнить конкурентную защиту, отличие primary key от дополнительного индекса и
    инкрементальную стоимость изменяемого B-tree.'
  answer: Выбран PostgreSQL с отдельными таблицами текущих остатков и истории. Для
    текущих остатков предложен primary key (warehouse_id, sku) и индекс (warehouse_id,
    available_qty ASC), для истории — (warehouse_id, sku, date DESC). Уменьшение остатков,
    запись истории и резервирование выполняются в одной транзакции. Wide-column база
    отвергнута из-за достаточности PostgreSQL и отсутствия опыта команды. Для optimistic
    locking каждая запись обновляется только при совпадении текущего количества с
    прочитанным; конфликт хотя бы одной строки приводит к откату и повтору всей операции.
    Изменяемые индексы замедляют запись и создают дополнительные расходы; P99 вставок
    и обновлений выше заданного SLO служит сигналом пересмотра.
takeaways:
- Если нет явных ограничений, то сначала лучше использовать реляционную БД, и только
  при возникновении проблем начинать делать денормализацию, переходить к NoSQL-решениям
  и так далее.
- 'Индексы не только ускоряют чтение, но и имеют накладные расходы: замедляют запись,
  потребляют память и место в кэше. Перед добавлением индекса надо понимать, что конкретно
  мы ускоряем.'
- В составном индексе надо помнить, что поля рассматриваются слева направо.
- При переходе к шардированию надо внимательно выбирать ключ шардирования, чтобы минимизировать
  операции между шардами.
