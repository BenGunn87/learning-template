practice:
  prompt: Спроектируйте хранение для сервиса назначения курьеров. В регионе одновременно
    работают до 200 000 курьеров; приложение раз в 5 секунд присылает heartbeat с
    courier_id, city_id, h3_cell, status и last_seen_at. Для нового заказа нужно найти
    до 20 доступных курьеров рядом с заданной ячейкой, предпочесть недавно активных
    и атомарно назначить одного так, чтобы два заказа не получили одного курьера.
    Также нужны чтение курьера по ID и история его статусов за 30 дней. Нагрузка heartbeat
    — около 40 000 обновлений в секунду. Требовалось выбрать хранилище, ключи и индексы,
    описать конкурентное назначение, отвергнутую альтернативу, цену индексов и сигнал
    пересмотра, а затем уточнить точный составной индекс и транзакционный механизм.
  answer: Пользователь выбрал одно хранилище PostgreSQL и первичный ключ courier_id.
    Для поиска предложил составной индекс (city_id, status, h3_cell, last_seen_at
    DESC). Для истории статусов предложил таблицу с courier_id, status и set_at и
    индекс (courier_id, set_at). Для конкурентного назначения предложил SELECT FOR
    UPDATE, если запрос выбирает одного курьера; при выборе нескольких кандидатов
    — условный UPDATE с проверкой, что статус всё ещё available, и повторный выбор
    при конфликте. NoSQL отвергнут из-за отсутствия опыта команды, необходимости атомарности
    и того, что данные помещаются на одной машине. Пользователь отметил частые изменения
    индексов с датой и назвал ухудшение P99 обновления сигналом пересмотра решения.
takeaways:
- По возможности лучше использовать мягкую блокировку.
observations:
- Практика проверяла применение узлов storage-selection, indexing и transactions в
  новом сценарии назначения курьеров.
- Пользователь самостоятельно выбрал PostgreSQL с учётом атомарности, масштаба и опыта
  команды и отверг NoSQL.
- После запроса на уточнение пользователь сформулировал составной индекс под фильтрацию
  по городу, статусу, ячейке и свежести heartbeat.
- Пользователь предложил условное обновление статуса с повторным выбором кандидата
  при конкурентном конфликте.
- Пользователь связал изменяемый временной столбец с ценой поддержки индекса и назвал
  P99 обновления измеримым сигналом пересмотра.
