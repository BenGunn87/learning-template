prompt: 'Сервис бронирует переговорные комнаты. Есть комнаты (room_id, building_id,
  capacity) и брони (room_id, start_at, end_at, status). Нужны история броней одной
  комнаты по времени, поиск доступных комнат здания на интервал и запрет двух пересекающихся
  подтверждённых броней при одновременных запросах. До 1 млн броней и 100 записей/с.
  Требовалось назвать ограничения выбора хранилища, выбрать основное хранилище, ключи
  и минимальные индексы, обеспечить конкурентный инвариант, назвать цену индекса и
  измеримый сигнал пересмотра. В уточнении: два запроса одновременно увидели пустой
  интервал; какой механизм гарантирует только одну подтверждённую бронь и какие индексы
  оставить для заданных чтений?'
answer: 'Первоначальный ответ:

  1) Поместится ли информация на одно машину. Если да то выбираем реляционную БД.
  Для первой таблице ключ room_id. Для второй таблицы нужен синтетический ключ booking_id

  Индексы для второй таблицы room_id, start_at ASC, status, второй инедкс room_id
  end_at ASC, status

  Индексы первой таблицы building_id

  Запрет на подтверждение брони делаем через оптимистическую блокировку. При инсерте
  проверяем нет ли в базе уже записей на это же время и если есть, то откатываем транзакцию


  Ответ на уточнение:

  1) При инсерте добавляется WHERE NOT EXISTS. Соответственно первый запрос отработает,
  а второй увидет, что комната уже занята и откатится

  2) Я бы оставил все индексы. Цена в увеличении времени вставки бронирования и необходимого
  места на диске. Пересмотрим при увеличении времени бронирования P99 некоего порогового
  значения'
takeaways:
- При вставке ного значения оптимистическую блокировку можно сделать через WHERE NOT
  EXISTS
observations:
- Пользователь предложил реляционную БД исходя из того, что данные помещаются на одну
  машину, и назвал ключи room_id и booking_id.
- Пользователь предложил два индекса для броней и индекс building_id для комнат; в
  уточнении сохранил все предложенные индексы.
- Пользователь предложил проверять отсутствие пересечения через WHERE NOT EXISTS перед
  вставкой и утверждал, что второй одновременный запрос увидит первый.
- Пользователь назвал увеличение времени вставки и дискового места ценой индексов,
  а превышение порога P99 бронирования сигналом пересмотра.
