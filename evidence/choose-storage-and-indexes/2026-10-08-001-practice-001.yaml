practice:
  prompt: 'Сервис промокодов маркетплейса. Кампания (campaign_id, starts_at, ends_at,
    total_limit) содержит промокоды (code — строка, campaign_id, per_user_limit =
    1). Активация: пользователь вводит code при оформлении заказа.

    Требования:

    - проверить код и активировать: общее число активаций кампании не больше total_limit,
    один пользователь не может активировать код дважды, даже при двойном клике/повторе
    запроса;

    - «Мои промокоды»: активации пользователя, новые сверху;

    - отчёт маркетинга: активации кампании за период по дням;

    - найти и отменить активацию по order_id при отмене заказа (лимит возвращается).

    Масштаб: 50 млн активаций в год, обычно 200 активаций/с, но при старте популярной
    кампании — до 5 000 активаций/с на один код в первые минуты.

    Нужно: (1) выбрать хранилище и обосновать от паттернов доступа и инвариантов,
    назвать отвергнутую альтернативу; (2) таблицы/ключи и минимальный набор индексов
    — для каждого индекса назови запрос, который он обслуживает, и порядок полей;
    (3) механизм соблюдения total_limit и однократности при параллельных запросах
    — конкретно, на уровне БД; (4) цена решения и что произойдёт при пике 5 000/с
    на один код; (5) измеримый сигнал, при котором ты пересмотришь решение.

    Уточнение (per_user_limit): фиксирован = 1 для всех кодов.

    Follow-up: Уточнение: (а) напиши конкретный SQL/последовательность операций активации
    в одной транзакции: что именно читается/обновляется для total_limit, что гарантирует
    отказ 1001-й активации при 1000 параллельных запросах и что происходит с проигравшими
    при оптимистичной блокировке; как при отмене заказа атомарно вернуть лимит. (б)
    Какой индекс обслуживает отчёт «активации кампании за период по дням» (таблица
    и порядок полей)? (в) Что конкретно произойдёт при 5 000/с на одну строку кампании
    (латентность, ретраи, ошибки) и один способ это смягчить. (г) Сформулируй сигнал
    пересмотра как метрику с порогом.'
  answer: "Исходный ответ:\n1) Выбираем реляционную БД, так как нужны ACID. Нужны\
    \ атомарные изменения связанных сущностей. Альтернативой может быть например key-value\
    \ хранилище, но могут быть проблемы с одновременным доступом к одному ключу\n\
    \  2) Таблица campaing: campaign_id, starts_at, ends_at, total_limit. Первичный\
    \ ключ campaign_id, индекс starts_at + ends_at нужен для отчета\n  таблица promocode:\
    \ promocode_id, code, campaign_id Первичный ключ promocode_id, индекс code - для\
    \ поиска коды для валидации, индекс campaign_id - для поиска всех кодов компании\n\
    \  таблица user_promocode: user_promocode_id, order_id, promocode_id, user_id,\
    \ status, activated_at. Первичный ключ user_promocode_id. Индекс user_id+activated_at\
    \ desc - поиск промокодов пользователя. Уникальный индекс по order_id - поиск\
    \ кода, который применен к заказу и проверка того, что к заказу применен только\
    \ один промокод. Уникальный индекс по user_id + promocode_id для контроля лимита\
    \ пользоавтеля. При отмене заказа удаляем данные об активации(можно дополнительно\
    \ переносить в архивную таблицу, если надо их сохранить)\n    3) total_limit контролируем\
    \ через оптимистичную блокировку. При изменении лимита проверяем что total_limit\
    \ не стал отрицательным. Если стал отрицательным то откатываем транзакцию\nОднократность\
    \ активация контролируется через уникальный индекс  user_id + promocode_id\n4)\
    \ При пике может быть проблема из-за большого количества попыток изменить total_limit\
    \ у одной компании. Надо следить за этим\n5) Надо следить за нагрузкой на БД.\
    \ Если при пике нагрузка будет приближаться к максимуму, то пересмотреть решение\n\
    \nОтвет на уточнение:\nа) Забыл написать. У нас будет отдельная таблица с щетчиками\
    \ campaing_total_limit: campaing_id, current_limit. Первичный ключ campaing_id.\
    \ При активации атомарно делаем уменьшение значения в этой таблице на 1 в апдейте\
    \ проверяем что значение  current_limit >= 1. Если не одна строка не обновлена,\
    \ то откатываем транзакцию \nВ одной транзакции мы уменьшаем общий лимит и записваем\
    \ данные в user_promocode\n\nПроигравшие запросы откатывают транзакцию и выдают\
    \ ошибку пользователю\nВ транзакции с отменой заказа мы удаляем запись из user_promocode\
    \ и добавлем 1 в campaing_total_limit\n\nб) Данные будем собирать из user_promocode,\
    \ соединяя её с  promocode, Группируем по activated_at\n\nв) Задержки увеличятся.\
    \ Возможно станет больше ошибок из-за достижения лимита. Как смягчить не знаю\n\
    \nг) Сигнал рост задержки выше какого-то предела"
takeaways:
- Надо посмотреть как обеспечивается откат транзакции при случаи когда update не изменил
  необходимую запись.
- Так же надо понять что происходит при большой нагрузке.
observations:
- Практика проверяла применение узлов storage-selection, indexing и transactions в
  новом сценарии промокодов с горячим счётчиком.
- Пользователь выбрал реляционную БД из-за ACID и атомарных изменений связанных сущностей;
  отверг key-value из-за конкурентного доступа к одному ключу.
- Пользователь предложил уникальные индексы (user_id, promocode_id) для однократности
  и order_id для поиска активации по заказу, индекс (user_id, activated_at desc) для
  «Моих промокодов».
- Для отчёта изначально предложен индекс (starts_at, ends_at) на campaign; после уточнения
  — группировка user_promocode с join promocode по activated_at без указания индекса.
- После уточнения пользователь предложил отдельную таблицу-счётчик и условный UPDATE
  с current_limit >= 1 в одной транзакции со вставкой активации, откат при 0 обновлённых
  строк; отмена — удаление активации и инкремент счётчика в одной транзакции.
- О пике 5 000/с на один код пользователь сказал, что вырастут задержки, способа смягчения
  не назвал; сигнал пересмотра — рост задержки выше неуказанного порога.
