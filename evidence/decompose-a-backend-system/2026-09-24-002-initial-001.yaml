recall:
  prompts:
  - 'Назовите три основные проверки качества границы компонента и кратко объясните,
    что каждая из них проверяет. Почему превращение двух тесно координирующихся модулей
    в отдельные сервисы часто увеличивает сложность? Назовите не менее двух конкретных
    механизмов этой сложности.

    '
  - 'Что проверяет когезия и какой признак показывает, что ответственность компонента
    собрана неудачно?

    '
  answers:
  - 'Проверяется единый владелец изменения данных: если данные меняют многие, то ответственность
    размывается. Атомарные операции желательно выполнять внутри одного сервиса и минимизировать
    взаимодействие между сервисами. Если изменение одного сервиса требует менять другие,
    разделение плохое. Отдельные сервисы добавляют сетевое взаимодействие, необходимость
    учитывать ненадёжность сети и усложняют согласованность вместо локальной атомарной
    операции.

    '
  - 'Когезия показывает, что меняется вместе. Если новая функциональность или изменение
    старой требует менять много сервисов, разделение плохое; при хорошем разделении
    большая часть изменения остаётся в одном сервисе.

    '
practice:
  prompt: 'Сервис продаёт билеты на мероприятия: часто читаются афиша и свободные
    места; конкретное место резервируется на 10 минут и не должно достаться двум покупателям;
    внешний платёжный callback может задержаться или повториться; после оплаты нужно
    выпустить билет и отправить email. Одна backend-команда работает при умеренной
    обычной нагрузке и пиках на старте продаж. Требовалось предложить минимальную
    декомпозицию, владельцев данных, синхронный и асинхронный потоки и одну спорную
    границу с компромиссом. Затем требовалось уточнить идемпотентность callback, позднюю
    оплату после истечения резерва и цену отдельного Ticketing-сервиса.

    '
  answer: 'Предложены компонент афиши и мест, который хранит мероприятия и статусы
    мест и резервирует их; компонент оплаты, взаимодействующий с провайдером; компонент
    билетов, выпускающий билеты и отправляющий email. Синхронный путь резервирует
    место и создаёт платёж. После оплаты компонент оплаты подтверждает бронь и запускает
    выпуск билета; билет и email создаются асинхронно. Идемпотентность callback обеспечивает
    компонент оплаты, хранящий обработанные заказы. Если успешная оплата приходит
    после истечения резерва и бронь подтвердить нельзя, запускается возврат. Ticketing
    выбран отдельным сервисом ради независимого развития личного кабинета и проверки
    билетов; цена — дополнительный сервис и сетевые взаимодействия при создании билета.

    '
takeaways:
- 'Не надо сразу стараться разбить систему на сервисы. Надо сначала продумать, что
  с чем будет взаимодействовать, кто будет владеть данными и как они будут изменяться.

  '
- Учитывать, какие действия должны быть атомарными, синхронными и асинхронными.
- Учитывать, как будущие изменения будут влиять на необходимость менять систему.
observations:
- Пользователь сообщил о завершении обоих материалов гибридного режима до проверки.
- 'В первоначальном ответе пользователь назвал владение данными, локальность атомарных
  операций, влияние изменений на другие сервисы, сетевые отказы и сложность согласованности.

  '
- Критерий когезии был сформулирован после отдельного уточняющего вопроса.
- 'В первоначальном практическом ответе пользователь выделил компоненты мест, платежей
  и билетов, а также синхронный и асинхронный участки потока.

  '
- 'После уточнений пользователь описал идемпотентную обработку платёжного callback,
  возврат после истечения резерва и выбрал отдельный Ticketing-сервис с явной ценой.

  '
