practice:
  prompt: 'Сервис бронирования столиков в ресторанах. Гость выбирает ресторан, дату,
    время и число гостей; в часы пик (пятница 18–20) на популярные рестораны идут
    всплески запросов на поиск свободных слотов. Один и тот же столик на одно время
    не может достаться двум гостям. Для части ресторанов нужна предоплата депозита
    через внешний платёжный провайдер (callback может прийти повторно или с опозданием);
    неоплаченная бронь держится 15 минут. У части ресторанов есть собственная POS-система,
    куда бронь нужно передать; POS бывает недоступна часами, но гость должен сразу
    получить подтверждение. За 2 часа до визита гостю уходит SMS-напоминание; при
    отмене позже чем за 3 часа депозит не возвращается. Ресторанам раз в сутки нужна
    статистика (заполняемость, no-show). Над backend работает одна команда из 5 человек;
    через полгода планируется вторая команда под интеграции с ресторанами.


    1. Предложи минимальный набор сервисов/модулей и владельца данных для каждого:
    где живут расписание и столики ресторана, бронь, депозит, статус синхронизации
    с POS, статистика?

    2. Какие взаимодействия синхронные, а какие асинхронные? Что видит гость, если
    POS ресторана недоступна в момент брони?

    3. Как гарантировать, что столик не продадут дважды при параллельных запросах,
    и что делать с callback об оплате, пришедшим после истечения 15-минутного удержания
    (конкретный ключ идемпотентности и правило)?

    4. Для каждой границы, которую ты делаешь отдельным сервисом, назови конкретную
    цену. Какую границу ты сознательно оставишь модулем сейчас и при каком сигнале
    её стоит выделить?


    Уточнение: 1) Блокировка в Redis с TTL: обработчик захватил лок, завис (GC-пауза,
    медленная БД) дольше TTL, второй запрос захватил лок на тот же столик, оба записали
    бронь. Какое ограничение на уровне БД (какие поля/ключ) гарантирует отсутствие
    двойной брони независимо от Redis? И что делать, если POS через час ожила и отвечает,
    что столик на это время уже занят у неё (гостю подтверждение уже отправлено)?
    2) Пять сервисов при команде из пяти человек: какие ты объединил бы сейчас и почему?
    Для сервиса синхронизации с POS и сервиса депозитов назови по одному конкретному
    сценарию, который становится сложнее из-за того, что это отдельный сервис.'
  answer: '1) Сервисы:

    Сервис бронирования - хранит информацию о ресторанах, и статусы столиков, статус
    сихнронизации с POS

    Сервис синхронизации с POS - делаем отдельным сервисом, так как в будущем предполагается
    отдельная команда

    Сервис депозиртов - выделаем в отдельны сервис работу с деньгами. Хранит данные
    о депозитах, статусе оплаты

    Сервис статистики - отдельный сервис для аналитики с отдельным хранилищем

    Сервис оповещения - отправка SMS. Сервис отвечает только за отправку сообщений.
    Текс он получает из сервиса бронирования

    2) Пользователь синхронно проверяет и бронирует столик

    При необходимости асинхронно шлем информацию в POS

    При необходимости асинхронно обрабатываем  информацию из платежной системы

    Если POS недоступна, то пользователь всё равно сразу получает информацию

    3) Проблему обработки  параллельных запросах я бы решал в коде. При начале записи
    бронирования делал бы мьютекс(например через Redis) по столику и дню. В мьютексе
    мы проверяем что столик не занят и записываем информацию о  бронировании. Это
    быстрая опреация и я не вижу проблемы в блокировании работы с одним столиком на
    определенное время

    Если опрлата пришла больше чем через 15 минут, то проверяем свободен ли стоили
    и если свободен, то подтверждаем бронирование. Если уже не свободен, то отменяем
    бронь и возвращаем депозит

    Ключом идемпотентности можно считать id брони. Если для одной брони пришел повторный
    callback, то ничего не делаем и возвращаем ответ который был для первого

    4) Разбиение на отдельные сервисы усложняет архитектуру. Добавляет сетивые вызовы.
    Усложныет деплой. В сервисе бронирования реализовано как бронирование, так и администрирование
    столиков рестораном. Можно вынести админестрирование в отдельный сервис, если
    потребуется ускорить получение информации о столиках через переход на другое хранилище


    Ответ на уточнение:

    1)

    а) Ограничение в БД сделать труднее, так как у нас есть время бронирования (начало
    и окончание бронирования столика). Не знаю как точно решить подобную проблему.
    Как варинат можно попробовать решить эту пробему через слоты. Каждый слот это
    30 минут. При бронировании мы занимаем слоты. Можно сделать уникальным индекс
    по столик, интервал слота. После истечении брони, если она не была подтверждена
    записи в слотах удаляются. Создание бронирования и занятие слотов происходит атомарно

    б) Возвращаем депозит если он был. Отправляем пользователю СМС, что к сожалению
    бронь не подтвердили

    2) Сервис оповещения и сервис статистики можно сейчас сделать частью основного
    сервиса бронирования, но как отдельные можули, чтобы потом их можно было вынести.
    Сервис оповещения так как пока нам надо слать только СМС. Если появится больше
    путей оповещения, то лучше вынести. Сервис статистики - так как пока нам надо
    не так много отчетов, но хранилише для статистики я бы срезу делал отдельно. Как
    мимнимум отдельную реплику, с которой не работает основной сервис

    Появляется распределенная транзакция, так как бронирование включает в себя: запись
    бронирования, начало оповещения POS(вызов метода или отправка сообщения в очередь),
    начало процессы оплаты. Это потребует распределенной транзакции, так как при неуспехе
    хотябы с одним действием, надо откатывать остальные'
takeaways:
- Не забывать про распределенные транзакции.
- Если делаем мьютекс, то дополнительно подумать как всё же сделать гарантию и через
  БД
observations:
- Практика проверяла применение узлов architecture-decomposition, service-architecture
  и tradeoff-analysis в новом сценарии бронирования столиков в ресторанах.
- В первоначальном ответе пользователь выделил сервисы бронирования, синхронизации
  с POS, депозитов, статистики с отдельным хранилищем и оповещения и назначил им владение
  данными.
- Пользователь выбрал синхронную проверку и бронь столика и асинхронные взаимодействия
  с POS и платёжным провайдером; гость получает подтверждение сразу при недоступной
  POS.
- Для параллельных броней пользователь изначально предложил блокировку в Redis по
  столику и дню без ограничения в БД.
- 'Для поздней оплаты пользователь предложил правило: подтвердить бронь, если столик
  свободен, иначе отменить и вернуть депозит; ключом идемпотентности назван id брони.'
- В первоначальном ответе цена сервисов названа обобщённо (сетевые вызовы, деплой);
  администрирование столиков оставлено модулем с сигналом выделения при смене хранилища.
- После уточнения пользователь предложил 30-минутные слоты с уникальным индексом по
  столику и слоту и атомарным созданием брони и слотов, отметив неуверенность в решении.
- После уточнения пользователь предложил при конфликте с POS вернуть депозит и отправить
  SMS об отмене, объединить оповещения и статистику с сервисом бронирования как модули
  (хранилище статистики оставить отдельным) и назвал распределённую транзакцию между
  бронью, POS и оплатой как цену отдельных сервисов.
