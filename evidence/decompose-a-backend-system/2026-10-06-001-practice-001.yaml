practice:
  prompt: "Программа лояльности сети из 300 кофеен. Касса (POS) в кофейне при покупке\
    \ начисляет\nбаллы (5% от чека) и позволяет оплатить баллами до 50% чека. Интернет\
    \ в кофейнях\nнестабилен: касса может быть офлайн до 2 часов, но должна продолжать\
    \ продавать.\nБаланс баллов не может уйти в минус. Баллы можно обменять на билет\
    \ в кино у\nпартнёра: партнёрский API медленный (до 10 с) и иногда отвечает таймаутом,\
    \ хотя билет\nуже выпущен. Мобильное приложение показывает баланс и историю операций;\
    \ после покупки\nгостю уходит push «+N баллов». Раз в месяц финансы получают отчёт\
    \ по обязательствам\n(сумма невыкупленных баллов). Backend делает одна команда\
    \ из 3 человек.\n\n1. Минимальный набор сервисов/модулей и владелец данных для\
    \ каждого: баланс и история\n   операций, обмены на билеты, профиль гостя, отчёт\
    \ для финансов.\n2. Где синхронное, а где асинхронное взаимодействие (покупка\
    \ онлайн, покупка офлайн с\n   последующей синхронизацией, обмен на билет, push,\
    \ отчёт)?\n3. Как гарантировать, что баланс не уйдёт в минус — с учётом офлайн-касс\
    \ и\n   одновременного списания с двух касс/приложения? Где проходит гарантия\
    \ (уровень БД /\n   кода / процесса) и что делаешь, если после синхронизации офлайн-списание\
    \ всё же\n   даёт минус?\n4. Обмен на билет: таймаут партнёра при уже выпущенном\
    \ билете и повторный вызов.\n   Конкретный механизм (порядок шагов, ключ идемпотентности,\
    \ компенсация).\n5. Назови цену каждого выделенного сервиса для команды из 3 человек\
    \ и что оставишь\n   модулем + сигнал, при котором выделишь его позже.\n\nУточнение\
    \ по вопросу пользователя: бизнес хочет разрешить оплату баллами на офлайн-кассе,\
    \ готов принять ограничения и небольшой риск; правило предлагает пользователь.\n"
  answer: "1) Сервис работы с баллами. Начисление списание баллов, история операций,\
    \ профиль гостя. Так же есть отдельный модуль для отчетов. \nСервис для покупки\
    \ билетов - отвечает за взаимодействие с партнером, отправлет запрос на списание\
    \ баллов в первый сервис. Хранит информацию про купленные билеты\nСервис для пушей\
    \ - отвечает за отпрвку пушей. Простой сервис, который слушает очередь с информацией\
    \ о заках и отправляет пуши. Можно написать один раз и особо не третить время\
    \ на поддержку \n2) Пользователь совершает покупку. POS кладет эту информацию\
    \ во внетреннюю очередь. Если касса онлайн, то сообщение из очереди тут же отправляется\
    \ в сервис работы с баллами. Если офлайн, то сообщения накапливаются и отправляются\
    \ при подключении кассы к сети.\nВ момент получения сообщения о покупке сервис\
    \ баллов отвправлет сообщение в очередь для пушей. Начисление иденпотентно по\
    \ id покупки(операции). В истории делаем ограничение на уникальность ключа id\
    \ покупки + тип операции. В историю мы только пишем. Лперация изменения баланса\
    \ и запись итории атомарна. id покупки можно сделать UUID, чтобы касса могла генерировать\
    \ его при работе офлайн. \nСервис для пушей читает сообщение и отправляет пуш\n\
    Покупка билета синхронная. Сообщаем об успехе сразу.  Общение с сервисом партнера\
    \ асинхронное. Его API должно быть иденпотентным, чтобы мы могли повторно отправлять\
    \ запрос, если возникла ошибка. Если в итоге оформить билет не удалось возвращаем\
    \ баллы на баланс и оповещаем пользователя например через пуш\nОтчет можно сделать\
    \ асинхронным. Пользователь запускает построение отчет, он строиться в фоне и\
    \ потом показывается пользователю\n3) Так как мы хотим дать возможность списывать\
    \ баллы при офлайн покупке, то мы не можем гарантировать что баланс не уйдет в\
    \ минус. Тут я вижу такое решение. Если касса онлайн, то просто запрашиваем баланс\
    \ пользователя и списываем баллы. Если касса офлайн, то можно сделать возможность\
    \ считать баланс пользователя из его мобильного приложения и разрешить потратить\
    \ какой-то процент от этого баланса. Если после синхранизации баланс ушел в минус,\
    \ то считаю это допустимой издержкой и приравнивать баланс к 0, чтобы не показывтаь\
    \ пользователю что он нам должен баллы(этот вопрос лучше обсудить с бизнесом)\n\
    4) Мы смотрим какая ошибка возникла при офрмлении билета. Если тайм аут или какая-то\
    \ 500, то через определенный интервал переотправляем сообщение. Предпалагается\
    \ что API оформления билетов иденпотентно. Если получили 400, что отменяем покупку\
    \ возвращая баллы на баланс. Покупка билетов происходит так, что мы с начала списываем\
    \ баллы с баланса подтверждаем покупку пользователю и начинаем асинхронное оформление\
    \ билета. При неуспехе делаем операцию по возрату(начислению) баллов.\nРабота\
    \ с балансом может быть реализована через писсиместичную блокировку в рядли у\
    \ нас возникнет ситуация, когда надо сразу выполнить много операций с балансом\
    \ одного пользователя. Тем самым мы гарантируем чтобы баланс не уходил в минус\
    \ при нормальной работе.\nКогда мы получем информацию от кассы которая была офлайн\
    \ и понимаем, что баланс ушел в минус, мы помечаем такую операцию, но не отменяем\
    \ её. Если опреация идет онлайн, то запрещаем уходить в минус\n5) Разбиение на\
    \ сервис работы с баллами и покупки билетов вызывает распределенную транзакцию.\
    \ Из-за этого надо предусматривать откат покупки\nМоделями оставил отчеты, профиль\
    \ гостя. Если формирование отчетов будет занимать много времени, то лучше вынести\
    \ его в отдельный сервис со своим хранилишем, оптимизированным для отчетов. На\
    \ первом этапе можно формировать отчеты через запросы к реплике\n"
takeaways:
- Явно прописывать то, что я предполагал (создание записи в сервисе билетов)
- Думал про офлайн журнал, но решил что чтение из клиента проще. Можно шифровать эти
  данные, чтобы им можно было доверять. Про это тоже можно было написать
- Цену сервисов расписывать для всех сервисов. Понимать про деплой, мониторинг
observations:
- 'Пункты 1–5 (application; nodes: architecture-decomposition, service-architecture,
  tradeoff-analysis) закрыты в первом ответе; задан один уточняющий вопрос об офлайн-оплате
  баллами.'
- Пользователь выделил сервис баллов (баланс, история, профиль, модуль отчётов), сервис
  билетов и сервис push; сам предложил UUID покупки, генерируемый кассой, уникальность
  (id покупки + тип операции) в истории, атомарное изменение баланса и истории и пессимистичную
  блокировку для онлайн-списаний.
- Для обмена на билет пользователь описал списание баллов, подтверждение пользователю,
  асинхронное оформление с повторами при таймауте/5xx в предположении идемпотентного
  API партнёра и возврат баллов при 4xx; запись обмена до вызова и собственный ключ
  идемпотентности явно не названы.
- Для офлайн-списания пользователь предложил брать баланс из мобильного приложения
  с лимитом в процентах и при минусе после синхронизации приравнивать баланс к 0 с
  пометкой операции.
- Цена выделения названа для разделения баллы/билеты (распределённая транзакция);
  для push-сервиса указано, что его можно написать один раз; для отчётов назван сигнал
  выделения.
- Обратная связь (запись exchange до вызова, write-off операция, недоверие к данным
  клиента, цена push-сервиса) показана после ответа и до выводов.
