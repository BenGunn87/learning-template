prompt: 'A (recall, без Reference): назови 3 признака, по которым проводишь границу
  между компонентами.

  B (understanding, без Reference): почему правило «у каждого набора данных ровно
  один владелец — источник истины»

  помогает проверить качество декомпозиции? Что конкретно ломается, если два сервиса
  пишут в одну таблицу?

  C (application, Reference можно): запись к врачам для сети из 40 клиник. Пациент
  выбирает врача и слот

  в приложении; регистратура тоже записывает по телефону; за сутки — SMS-напоминание;
  после приёма врач

  вносит заключение; раз в день страховые получают реестр оказанных услуг; backend
  — команда из 4 человек.

  1) Минимальный набор компонентов и владелец данных: расписание/слоты, записи, заключения,
  реестр для страховых.

  2) Какие потоки синхронные, какие асинхронные?

  3) Одно разделение, которое сознательно не делаешь сейчас, и сигнал, при котором
  сделаешь.

  '
answer: 'Работа с данным. Желательно чтобы операции, которые должны выполнятся атомарно
  принадлежали одному компоненту

  Причины для изменений. Если для вненсения изменения требуется менять много компонентов,
  то скорее всего они разбиты не правильно.

  Характер работы и нагрузки на компонент. Если есть часть, которая например работает
  под высокой нагрузкой на чтение и часть которая работает под не большой нагрузкой
  на запись, то возможно их стоит разбить

  Если это правило не выпоняется, то скорее всего декомпозитация выполнена не верно.
  Если два сервиса пишут в таблицу, то нет единого источника истены. Так же изменения
  в таблице потребуют изменения в обоих сервисах


  - Сервис пациентов - хранит информацию о пациетах. Используется для авторизации
  пациентов. Для поиска пациентов при их записи и т.д. Так же он хранит заключения
  по пациентам

  - Сервис для записи на прием - хранит информацию о свободных слотах и записях пациентов
  на прием. Отдельным модулем в сервисе реализовано SMS оповещение

  -  Сервис для отчетности, который формирует реестр оказанных услуг. Работает с отдельной
  репликой

  2) Запись на прием синхронная. Оповещение по SM асинхронное. Формирование реестра
  асинхронное

  3) Сейчас не вынашу оповещение в отдельный сервис так как используем только SMS.
  Если появится больше способов для оповещения, то лучше выделить в отдельный сервис,
  который будет принимать сообщения от сервиса для записи на прием

  '
takeaways:
- Для отчетов не всегда подходит реплика, если нужны данные из разных источников,
  то можно сделать прием сообщений и запись данных, необходимых для отчетов
