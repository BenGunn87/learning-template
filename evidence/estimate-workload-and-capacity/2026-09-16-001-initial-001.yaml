  title: Google SRE — Non-Abstract Large System Design
  url: https://sre.google/workbook/non-abstract-design/
  type: article
  language: en
recall:
  prompts:
  - 'Не подглядывая в материалы, ответь своими словами:

    1. Пусть у сервиса известны DAU, число чтений и записей на пользователя в день.
    Как получить средний read/write RPS и как перейти от среднего к пиковому? Назови
    допущения и единицы.

    2. Как из RPS и размера объекта оценить сетевую пропускную способность и рост
    хранилища? Какая ошибка с единицами здесь особенно вероятна?

    3. Почему диапазон с явными допущениями и запасом полезнее одного «точного» числа?
    На какие архитектурные решения такая оценка влияет?'
  - 'Уточни два пункта своими словами:

    1. Если фактического распределения активности внутри суток нет, как всё же получить
    полезную проектную оценку пикового RPS?

    2. Какую именно часть RPS нужно использовать для расчёта прироста хранилища и
    какие дополнительные множители могут понадобиться?'
  answers:
  - '1) Средний можно получить умножив DAU на число чтеней/записей пользователя в
    день и раз на 86400 (количество секунд в день) получим значение в RPS. При этом
    мы допускаем что нагрузка от разных пользователей примерно одинаковая. Пиковый
    RPS найти не получится, если мы не знаем как активность пользователей распределена
    внутри дня

    2) Можно умножить RPS на размер объекта и тем самым получить необходимую пропускную
    способность. Если это значение умножить на 86400, то получим рост хранилища за
    сутки. Думаю в единицах можно ошибится при сравнении бит/сек и байт/сек. Обучно
    объем объекта задается в байтах, а скорость в бит/с

    3) Диапазон полезнее, так как обычно слишком много факторов и наше "точное" число
    на самом деле не точное. Это влияет на то, как система должна  маштабироваться,
    достаточно ли пропускной способности сети, ресурсов одной машины и т.д.'
  - 'Можно попробовать взять данные похожих сервисов и вывести из них коэффициент.
    Например пиковый RPS в 10 раз больше среднего

    2) Только ту часть, котора относится к пищущим запросам. Так же надо учесть например
    место для индексов. При репликации надо будет умножить на 2'
practice:
  prompt: 'Сервис имеет 1 000 000 DAU. Каждый пользователь в среднем делает 30 чтений
    и 2 записи в сутки. Средний ответ на чтение — 20 KB, размер записываемого объекта
    — 100 KB. Для пика используем коэффициент 8. Все записанные объекты хранятся год,
    replication factor — 3, индексный overhead — 20%. Считай 1 KB = 1000 B, 1 GB =
    10^9 B, 1 TB = 10^12 B; протокольные накладные расходы и сжатие игнорируй.


    Оцени, показывая формулы и единицы:

    1. Средний и пиковый read/write RPS.

    2. Суточный сетевой трафик отдельно для чтений и записей, затем суммарно.

    3. Годовой объём хранилища с учётом репликации и индексов.

    4. Какое вероятное узкое место видно из расчёта и какое архитектурное решение
    ты бы проверил первым?


    После первоначального ответа требовалось исправить пиковый write RPS, пересчитать
    общий пиковый трафик в Mbit/s и отличить балансировку/горизонтальное масштабирование
    от шардирования хранилища.'
  answer: '1) средний read около 347RPS, пиковый 2778RPS, средний write окло 23RPS,
    пиковый 158RPS

    2) Трафик чтения 600GB/day, тарфик записи 200GB/day, сумма 800GB/day

    3) 262.8TB

    4) Возможно узким местом может стать сеть, так как пиковый трафик блигок к 1Гбит/сек.
    сообветственно имеет смысл предусмотреть распределение тарифика на несколько машин
    через шардирование


    Исправление:

    1) 185,2RPS В своем ответе я округлил, так как посчитал что точность до целых
    достаточно и опечатался, когда писал 185

    2) 592,5Mbit/s


    Архитектурный вывод:

    Кажется что пропускной способности сети будет достаточно. Можно добавить балансировшик
    и горизотальное масштабирование для обеспечения надежности. Шардирование хранилишя
    я бы тоже добавил. Не уверен какой объем дисков на сервере но при учете 262TB
    в год, кажется что одного хранилища может не хватить'
takeaways:
- Стало понятно как из DAU и количества запросов среднего пользователя рассчитывать
  RPS и пиковый RPS.
- Что надо оценивать нагрузку на сеть и необходимы объем хранилица.
- Не забывтаь про репликацию и дополнительные затраты на индексы и т.д.
observations:
- Пользователь сообщил о завершении выбранных материалов до Active Recall.
- В первоначальном Recall пользователь указал, что без распределения активности пик
  определить нельзя; после уточнения предложил использовать коэффициент по аналогичным
  сервисам.
- В первоначальном расчёте peak write RPS было записано 158; пользователь затем сообщил
  об опечатке и привёл 185,2 RPS.
- После дополнительного запроса пользователь рассчитал общий пиковый трафик 592,5
  Mbit/s.
- Пользователь связал горизонтальное масштабирование с надёжностью, а объём 262,8
  TB в год — с необходимостью масштабирования хранилища.
