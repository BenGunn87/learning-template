practice:
  prompt: 'Социальная лента обслуживает 10 000 000 DAU. Каждый пользователь в среднем

    делает 100 чтений ленты и 0,2 записи комментария в сутки. В самый нагруженный

    час происходит 30% всех суточных операций; соотношение чтений и записей не

    меняется. Средний ответ чтения — 5 KB, одна запись — 1 KB. Комментарии

    хранятся 2 года, replication factor = 3, overhead индексов = 50%. Один

    экземпляр приложения устойчиво обслуживает 5 000 read RPS, суммарный внешний

    канал — 10 Gbit/s. Используются десятичные единицы.


    Требовалось оценить средний и пиковый read/write RPS, пиковую исходящую и

    входящую пропускную способность, объём хранения за два года, а затем назвать

    первое ограничение, архитектурное изменение и обоснованность шардирования.

    '
  answer: '1) avr read  RPS = 10*10^6*100/86400 = 11574RPS

    max read RPS = 10*10^6*100*0.3/3600 = 83333.3RPS

    avr write RPS = 23.15RPS

    max write RPS = 166.66RPS

    2) input = 1.33Mbit/s

    output = 3.33Gbit/s

    3) 6.57Tb

    4) Первым проявится ограничение на количество read RPS, поэтому нужен балансировшик
    и горизонтальное мастабирование. Шардирование не оправдано, так как на требуется
    не так много места для хранения данных

    '
takeaways:
- Пропускную способность сети и ресурсы машин определять по пиковой нагрузке.
- Для хранения данных учитывать срок хранения.
observations:
- Пользователь записал формулы среднего и пикового read/write RPS и получил значения
  11 574, 83 333,3, 23,15 и 166,66 RPS.
- Пользователь рассчитал пиковую входящую полосу 1,33 Mbit/s, исходящую 3,33 Gbit/s
  и объём хранения 6,57 TB.
- Пользователь назвал read RPS первым ограничением, предложил балансировщик и горизонтальное
  масштабирование и не счёл объём хранения достаточным основанием для шардирования.
