prompt: 'Без материалов: у сервиса 500 000 DAU; каждый пользователь делает 20 чтений

  и 1 запись в сутки. Ответ на чтение — 10 KB, новая запись — 100 KB.

  Пик равен 6 средним нагрузкам, данные хранятся 30 дней, две копии.

  Десятичные единицы, накладными расходами пренебрегаем.

  Покажи формулы и единицы для среднего и пикового read/write RPS,

  пиковой исходящей полосы в Mbit/s и объёма хранения.

  Затем скажи, какое допущение о пике здесь сделано и почему

  объём хранения считают по записям, а не по чтениям.


  Уточнение: перепроверь пиковую исходящую полосу — умножь peak read RPS

  на 10 KB и переведи байты в биты. Уточни обозначение единицы для объёма 3.'
answer: 'Первоначальный ответ:

  1) avr RPS read = 500000 * 20 /86400 = 115.75 RPS

  pik RPS read = 115.75 * 6 = 694.44 RPS

  avr RPS write = 500000/86400 = 5.79 RPS

  pik RPS write = 5.79*6 = 34.72 RPS

  pik trafic = 138.89Mbit/sec

  хранилище 3Tb

  2) По прошлому опыту оцениваем на сколько пиковые показатели были больше средних

  3) Потому что хранилище необходимо только для записи данных. При чтении мы используем
  хранилище для чтения


  Ответ на уточнение:

  111,11 Mbit/sec не обратил внимание что надо было только исходящий и прибавил входящий

  3 терабайта'
takeaways:
- Да, при расчета трафика допустил ошибку и умножил на на 10, а на 20. Надо быть внимательнее
observations:
- Пользователь самостоятельно рассчитал средний и пиковый read/write RPS с правильными
  формулами и приблизительными значениями.
- Пользователь назвал коэффициент пика оценкой по прошлому опыту и объяснил, что чтения
  не создают новые сохраняемые данные.
- Первоначально пользователь указал пиковую исходящую полосу 138,89 Mbit/s, после
  уточнения — 111,11 Mbit/s.
- Пользователь уточнил, что оценка объёма 3 относится к терабайтам; формулу объёма
  не записал.
