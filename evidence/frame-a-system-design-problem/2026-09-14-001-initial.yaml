  language: en
recall:
  prompts:
  - 'Чем функциональные требования отличаются от нефункциональных? Приведи по одному
    примеру для сервиса сокращения ссылок.

    '
  - 'Почему на этапе требований важно явно определить приоритеты и то, что остаётся
    вне scope?

    '
  answers:
  - 'Функциональные требования описывают какие функции должен выполянить сервис(например
    как мы должны сокращать ссылки, какие типы ссылок поддерживать) Не функциоанльные
    требования описывают как сервис функционариует: например какую нагрузку он должен
    выдерживать, с какой задержкой допустимо отвечать, какая должна быть доступность

    '
  - 'Выжно определить приоритеты, чтобы сфокусироваться на них, так как у нас немного
    времени

    '
practice:
  prompt: 'Тебе дали задачу «Спроектируй сервис сокращения ссылок». Уточнения интервьюера:
    10 млн новых ссылок в сутки; перенаправлений примерно в 100 раз больше, чем созданий;
    для перенаправления важна низкая задержка; после успешного создания ссылка не
    должна потеряться; аналитику переходов можно добавить позднее. Составь краткий
    design brief: два обязательных функциональных требования; что оставишь вне scope;
    два измеримых нефункциональных требования; один архитектурный компромисс, который
    следует из этих требований, и почему ты его выбираешь. После первоначального затруднения
    были предложены варианты: отвечать после надёжной записи или отвечать сразу и
    записывать асинхронно; требовалось выбрать вариант и объяснить его.

    '
  answer: '1) Пользователь может отправить ссылку и получить её в сокрещенном виде.
    При переходе по сокращенной ссылке, пользователь перенаправлется на исходную страницу.
    2) Аналитику переходов пока не рассматриваем. 3) Задержка перенаправления должна
    быть меньше 200мс(можно уточнить значение). Система должны выдерживать создание
    до 10 миллионов новых ссылок в день и до 1 миллиарда перенаправлений в день. 4)
    Затрудняюсь ответь. После подсказки: Я бы выбрал первый вариант так как увеличение
    задерки при создании сслыки менее критично, чем потеря после подтверждения.

    '
takeaways:
- 'При собеседование не надо сразу домать как решить задачу, надо с начала подумать
  о требованиях к системе.

  '
- Надо учитывать как функциональные так и не функциональные требования.
- 'Постараться выделить ключевые требования и те которые можно пока не учитывать.

  '
- 'Надо постараться сформировать понимание системы, которую нам надо спроектировать.

  '
observations:
- Пользователь сообщил о завершении выбранного материала до Active Recall.
- 'В первоначальном ответе на практику пользователь сообщил о затруднении с архитектурным
  компромиссом.

  '
- 'После предъявления двух вариантов пользователь выбрал подтверждение только после
  надёжной записи и объяснил выбор меньшей критичностью задержки создания по сравнению
  с потерей подтверждённой ссылки.

  '
