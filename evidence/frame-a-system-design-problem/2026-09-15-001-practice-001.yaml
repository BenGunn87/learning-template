practice:
  prompt: 'Представьте сервис бронирования билетов. На популярные события бывают всплески
    нагрузки в пять раз; нельзя продать одно место двум людям; подтверждение желательно
    выдавать не дольше чем за 500 мс; платёжный провайдер иногда отвечает медленно
    или недоступен; бизнес просит подтверждать покупку сразу. Какие требования конфликтуют?
    Предложите два архитектурных варианта, выберите один и объясните, чем осознанно
    пожертвуете. Дополнительно уточните, что сервис может честно сообщить за 500 мс:
    «покупка подтверждена» или «место зарезервировано, платёж обрабатывается», и почему.'
  answer: Конфликтуют требования что подтверждение надо выдавать за 500 мс и сразу
    и что платежный провайдер иногда отвечает медленно или недоступен. 1) Можно возвращать
    подтверждение сразу, а платеж обрабатывать асинхронно. При этом производить резервирование
    билетов до момента обработки платежа, чтобы не продать одно место двум людям.
    2) Можно пожетвовать требованием отвечать за 500 мс и ждать пока ответит платёжный
    провайдер. Но в этом случаи если провадер не доступен, то и наш сервис не работает.
    Выбираем первый вариант. При этом варианте мы можем столкнуться с ситуацией, когда
    белеты будут зарезервированы и новые люди не смогут их забронировать, но в итоге
    платеж не пройдёт и они снова будут доступны. Так де потребуется какая-то логика
    чтобы оповестить пользователя при неудачном платеже. Я бы сообщал, что «место
    зарезервировано, платёж обрабатывается», так как это понятнее пользователю и не
    вызовет сюрпризов при проблемах с платежом.
takeaways:
- Первоначальные требования могут быть противоречивы. Надо выявить эти противоречия
  и предложить "безнесу" варианты решения. Это позволит прийти к компромису и изменить
  требования.
observations:
- Пользователь самостоятельно выявил конфликт между требованием быстрого ответа и
  зависимостью от медленного или недоступного платёжного провайдера.
- Пользователь предложил синхронный и асинхронный варианты, выбрал резервирование
  с асинхронной оплатой и назвал последствия выбора.
- После уточняющего вопроса пользователь отделил подтверждение резерва от подтверждения
  завершённой покупки.
