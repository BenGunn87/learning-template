prompt: 'Ты проектируешь сервис доставки webhook-событий. Приём события должен занимать
  не более 100 мс; получатель может отвечать медленно или быть недоступен; повторная
  доставка иногда вредна; события нужно хранить 7 дней; панель аналитики желательна,
  но не обязательна для первого релиза. Составь краткий design brief: какие вопросы
  ты уточнишь в первые минуты; назови два обязательных сценария и что оставишь вне
  scope; сформулируй два измеримых нефункциональных требования; укажи конфликтующие
  требования; выбери архитектурный компромисс и сформулируй честную гарантию для клиента.
  После первоначального ответа требовалось дополнить два обязательных пользовательских
  сценария и один краткий вывод.

  '
answer: '1) Какое количество событий ожидается, чтобы понять нагрузку

  2) Вне scope оставляем панель аналитики

  3) Прием события занимает не более 100 мс. Событие должно хранится 7 дней

  4) Конфликтует что получатель может отвечть медленно или быть недоступен и что повторная
  доставка не желательна

  5) Мы принемаем событие и сохраняем у себя, после этого асинхронно начинаем отправлять
  его получателю. При его недоступности делаем ретраи. Мы можем гарантировать что
  событие будет доставлено как минимум один раз. Гарантировать что быдет доставлено
  только один раз не можем


  Дополнение:

  1) Пришло событие. Мы его зафиксировали и отправили получателю. Получатель успешно
  принял сообщение

  2) Пришло событие. Мы его зафиксировали и отправили получателю. Получатель не доступен.
  Отложили доставку и переотправляем сообщение через определенный промежуток времени.
  Получатель стал доступен и получил сообщение'
takeaways:
- 'надо всегда рассчитывать что сообщение будет доставлено хотябы один раз и проектировать
  систему так, чтобы повторная доставка не была проблемой

  '
observations:
- 'В первоначальном ответе пользователь указал вопрос об ожидаемом количестве событий,
  исключил аналитику из scope и сформулировал требования по времени приёма и сроку
  хранения.

  '
- 'Пользователь предложил сначала надёжно фиксировать событие, затем доставлять его
  асинхронно с повторами при недоступности получателя.

  '
- 'Пользователь сформулировал гарантию at-least-once и отдельно указал, что exactly-once
  гарантировать нельзя.

  '
- 'После дополнительного запроса пользователь описал успешный и отказной пользовательские
  сценарии.

  '
