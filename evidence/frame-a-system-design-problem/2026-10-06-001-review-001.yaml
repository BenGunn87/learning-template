prompt: 'Сервис промокодов для онлайн-магазина игровых предметов. Маркетинг создаёт
  кампанию: N кодов (до 1 млн), у каждого кода — лимит активаций (1 или «многоразовый
  до X»), срок действия, скидка. Игрок вводит код при оплате. Запуск кампаний анонсируют
  у стримеров — в первые минуты до 20 тыс. попыток активации в секунду. Код с лимитом
  1 не должен сработать дважды. Платёж может не пройти после того, как код уже «применён».
  Отчёт по использованию кампании маркетингу нужен «примерно в реальном времени».
  Антифрод (перебор кодов ботами) — желателен, но не обязателен для первого релиза.

  A) [recall; node: design-process] Перечисли блоки, из которых должен состоять design
  brief. B) [application; nodes: requirements-analysis, functional-nonfunctional-requirements]
  Составь brief: 2–3 уточняющих вопроса; 2 обязательных сценария (успех и отказ) и
  что вне scope; 2 измеримых NFR (переведи «примерно в реальном времени» в число);
  ограничения/допущения. C) [understanding; node: tradeoff-analysis] Назови конфликтующие
  требования, выбери компромисс и объясни, почему именно требования/ограничения делают
  этот выбор правильным. Какую честную гарантию дашь маркетингу по отчёту и игроку
  по коду, если платёж упал?

  '
answer: 'A) К сожалению не помню блоки

  B)

  1) Срок действия и скидка свои у каждого кода или общую на компанию? Если по примененному
  коду не прошел платёж, долны ли мы дать возможность использовать его повторно?

  2) Вне скоупа остается антифрод. Пользователь применяет промод, скидка учитывается,
  лимит промокода уменьшается, платеж проходит. Пользователь пытается применить промокод
  лимит которого уже исчерпан, промокод не применяется, пользователь получается соответствующее
  сообщение

  3) За какое время должн отрабатывать метод применения промокода. Можно ли трактовать
  "примерно в реальном времени" как задержка в несколько минту(например 5 минут)?

  4) Не знаю что ответить


  C)

  1) Конфликтует что код не должен сработать дважды, но при это м платеж может не
  пройти. Есть два варианта, в первом мы делаем резервирование кодов и через какое-то
  время снимаем резер. Во втором случаи если мы применили код, то считаем что лимит
  уменьшился не зависимо от результата платежа. Второй вариант кажется менее предпочтительным,
  так как боты могут заредимить все коды и компания провалица. Во втором случаи возникает
  проблема с долгими платежами. Может прийти успешный платеж в тот момент когда резер
  истек и лимит исчерпан. Как первый варианат я бы всё равно пропускал такой платеж,
  хоть он и череват фродом, но не таким серьезным и мы не получаем проблем с отменой
  платежа. Маркетингу можно дать гарантияю, что отчет будет оставать на несколько
  минут, особенно в момент старта акции. Так же будут неточности из-за резервирования
  и часть кодов могут быть применены выше лимита, но не координально'
takeaways:
