recall:
  prompts:
  - 'Не подглядывая в материал, ответь своими словами:


    1. С чего следует начинать выбор модели данных и почему списка сущностей самого
    по себе недостаточно?

    2. Сравни реляционную, документную и key-value модели по типичным паттернам доступа
    и границе атомарности.

    3. Когда несколько моделей хранения оправданы, а когда это преждевременное усложнение?'
  - 'Уточни границу атомарности: что обычно можно изменить атомарно в документной
    и key-value моделях и почему это важно при моделировании связанных сущностей?'
  answers:
  - '1) Надо понять какие деуствие мы будем с ними совершать: чтени, запись, точечьный
    поиск и т.д. . Изменяются ли они или нет, есть ли четкая схема. Какая доступность
    должна быть. Нужны ли нам транзакции и ACID

    2) Реляционные - есть жесткая схема с множественными связями и изменениями значений.
    Есть транзакции и гарантии ACID

    Документная - связей меньше, структура документов гибкая, что позволяет добавлять
    новые поля

    key-value - запись и поик значений по ключу. Быстрый доступ. Обучно применяется
    для кэширования

    3) Если есть сущности с разными необходимыми требованиями к достопу и паттернами
    работы с ними. Если можно обойтись одним решением, то лучше выбрать его'
  - В документе обычно можно атамарно изменить один документ, а в key-value одно значение.
    Это важно если надо менять много связанных сущностей
practice:
  prompt: 'Спроектируй хранение для сервиса оформления заказов. Пользователь создаёт
    заказ из нескольких товаров; остаток нельзя продать дважды; платёж выполняет внешний
    провайдер и может подтвердиться позже; пользователь часто читает заказ по ID и
    историю своих заказов; склад выбирает оплаченные заказы для сборки.


    1. Назови основные сущности и ключевые паттерны чтения/записи.

    2. Что должно меняться атомарно, а что может согласоваться асинхронно?

    3. Какую модель или сочетание моделей хранения выберешь? Обоснуй через требования
    и назови главный компромисс.


    После первоначального ответа требовалось уточнить защиту от конкурентной продажи
    последней единицы товара, индексы для истории пользователя и очереди склада, а
    также идемпотентность повторного callback платёжного провайдера.'
  answer: '1) Сущности: заказ, товар, остаток товара, платеж. Чтение конретных сущностей
    по ID. Поиск по статусу. Посие

    2) Атомарно создаем заказ и меняем остатки товаров. Асинхронно согсуем платеж

    3) Выбираем реляционную модель так как нужны транзакции для изменения связанных
    сущносте. Компромис в том, что реляционные БД обычно сложнее горизонтально  масштабировать


    Уточнение:

    1) Одна транзакция измеинт остаток на 0. Вторая увидет что во время её работы
    были внесены изменения и откатится

    2) Для истории потребуется иденс по покупателю. Для Очереди индекс по статусу
    и скорее всего дате заказа

    3) Надо учесть чтобы операция были иденпотентна. Если мы уже обработали связанный
    с платежом заказ, то не выполнять повторные действия'
takeaways:
- Для выбора модели данных надо понять какие данные мы собираемся хранить и как с
  ними работать. Как мы будем их читать, часто ли изменять, много ли связанных сущностей
  и т.д.
- Надо учитывать границы атомарность. Надо ли менять несколько связанных сущностей
  или будет изментся только одно сущность. Так же надо учитывать нужна ли нам постоянная
  согласованность или достаточно согласованности через время
observations:
- Пользователь сообщил о завершении выбранного материала до Active Recall.
- В первоначальном Recall пользователь назвал чтение, запись, точечный поиск, изменяемость,
  схему, доступность и транзакционные гарантии критериями выбора модели данных.
- После отдельного вопроса пользователь указал типичные границы атомарности одного
  документа и одного key-value значения.
- В практическом сценарии пользователь выбрал реляционную модель для атомарного создания
  заказа и изменения остатков, а подтверждение платежа отнёс к асинхронному согласованию.
- После уточняющих вопросов пользователь предложил обнаруживать конкурентное изменение
  остатка, индексы по покупателю и по статусу с датой, а также идемпотентную обработку
  повторного callback платежа.
