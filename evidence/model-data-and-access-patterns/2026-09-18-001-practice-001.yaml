practice:
  prompt: 'Спроектируй хранение для сервиса продажи билетов с выбором конкретных мест.
    Пользователь ищет мероприятия по городу и дате, открывает схему зала, удерживает
    выбранные места на 10 минут и оплачивает их через внешнего провайдера. Одно место
    нельзя продать дважды. Callback оплаты может прийти повторно или после истечения
    удержания. Пользователь читает заказ по ID и историю своих заказов, а контролёр
    проверяет QR-код билета на входе.


    1. Какие сущности и основные паттерны чтения/записи здесь нужны?

    2. Что должно изменяться атомарно? Как защититься от конкурентной продажи места
    и повторного callback?

    3. Какую модель хранения, ключи и индексы вы выберете? Какие данные могут согласовываться
    асинхронно?

    4. Назовите главный компромисс вашего решения.


    После первоначального ответа требовалось уточнить конкретный механизм конкурентного
    удержания и обработку позднего callback для свободного, удержанного и уже купленного
    места.'
  answer: '1) Пользователь, мероприятие, зал, место, заказ. Чтение конкретных связанных
    сущностей, поиск с фильтрацией, запись конкретных сущностей

    2) Атомарно должно происходить создание заказа и изменение статуса места на удержание.
    Для защиты от callback делаем операцию подтвержения оплаты иденпотентной по номеру
    заказа

    3) Реляционая модель, так как много связанных сущностей и нам нужна ACID. Для
    мероприятия будет индекс по городу и дате. В заказах индекс по пользователю. В
    местах для мероприятия идекс по мероприятию и стутусу места

    4) Компромис в том, что если callback придет после 10 минут, то резерв уже истечет
    и мечто может оказаться купленным. Придется делать возврат или как-то решать проблему
    с помошью службы поддержки


    Уточнение:

    1) При коммите транзакции проверяется, не были ли изменены данные, которые она
    пытается поменять, если были, то транзакция отвкатывается. Как этот механиз называется
    не знаю

    2) Если место свободное, то меняем его статус на куплено и продолжаем обычныю
    работу

    Если место удержано, то я бы попробовал сделать отложенную обработку до момента,
    когда оно по должно освободится. В этот момент опять проверить статус и если оно
    освободилось, то помечаем как купленное и продолжаем успешную обработку. Если
    в этот момент оно уже помечено купленным, то переходим к третьему пункту

    Если место куплено, то можно сделать автоматический возврат средств и оповещение
    пользователя, о том, что покупка не удалась

    Или не делать автоматический возврат о опопвесить пользователя с предложаением
    перевыбрать место или запросить возврат'
takeaways:
- Понял как можно реализовать защиту от конкуренции между думя транзакциями. Обычно
  мы используем SELECT ... FOR UPDATE
observations:
- Практика проверяла применение узлов data-modeling, transactions и sql-and-nosql
  в новом сценарии продажи билетов.
- Пользователь выделил основные сущности, транзакционное создание заказа с удержанием
  места, реляционную модель и индексы под поиск мероприятий, историю заказов и доступность
  мест.
- Пользователь самостоятельно указал на идемпотентность подтверждения оплаты и проблему
  callback после истечения удержания.
- После уточняющего вопроса пользователь описал откат при обнаружении конкурентного
  изменения, но не назвал механизм оптимистического контроля конкуренции.
- Для места, удержанного другим заказом, пользователь предложил дождаться освобождения
  и повторить обработку; привязка перехода к исходному удержанию не была учтена.
