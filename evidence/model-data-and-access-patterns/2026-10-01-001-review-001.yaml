prompt: 'Без материалов.

  Recall: 1) Перечисли по шагам, из чего выводится модель данных — от пользовательских
  сценариев до выбора хранилища. 2) Назови два основных подхода к защите от конкурентного
  изменения одной строки в реляционной БД и коротко опиши механизм каждого.

  Understanding: 3) Почему граница атомарности (одна строка / один документ / транзакция
  над несколькими таблицами) влияет на то, как раскладывать связанные данные по записям?

  Application: 4) Сервис бонусных баллов: начисления и списания по заказам, баланс
  не должен уйти в минус при параллельных списаниях, пользователь смотрит баланс и
  историю операций, повторный запрос на списание по тому же заказу не должен списать
  дважды. Назови сущности и ключевые запросы, что меняется атомарно, какое хранилище
  и минимальные ключи/индексы выберешь.


  Уточнение: что именно должно выполниться в одной транзакции при списании и что будет,
  если UPDATE баланса прошёл, а вставка в историю — нет? Начисление и списание могут
  относиться к одному заказу — как это повлияет на уникальный индекс по order_id?'
answer: 'Первоначальный ответ:

  1) Надо понять какие сцанарии у нас есть: чтение, запись их интенсивность. Как изменяются
  данные при записи, надо ли атомарно менять большое количество связанных данных.
  Какой объем данных надо хранить. Помеятатся ли они на одну машину или требуется
  шардирование. Какой характер данных, например файлы

  2) Можно использовать писиместическую блокировку при которой мы читаем строку и
  блокируем её от изменения пока сами не внесли изменения. Оптиместическая блокировка
  - при внесении изменений мы как-то проверяем изменилась ли строка после того как
  мы её прочитали или нет, если изменилась, то считаем операцию не успешной и откатываем
  её

  3) От того что меняется атомарно зависит как мы можем разделить данные. Легче всего
  менять данные атомарно, если все они находятся на одной машине. Если данные находся
  на разных машинах, то приходится делать распределенную транзакцию что заметно усложняет
  систему

  4) Реляционное хранилище. Таблицы:

  balance - balance_id, user_id, quantity. Первичный ключ balance_id, индекс по user_id

  balance_history - balance_history_id, balance_id, order_id, quantity, created_at.
  Первичный ключ balance_history_id, индекс balance_id+created_at, order_id - уникальный


  Для гарантии что баллын не уйдут в минут в запросе на изменение баланса проверяем
  что текущий баланс больше, чем сумма, которую пытаемся списать. Если апдейт не изменил
  строку, то считаем, что операция была не успешной

  При обработки запроса на списени, проверяем есть ли он в истории. Если есть, то
  считаем что мы его уже обработали. Так же это гарантируется уникальным индексом
  по order_id


  Ответ на уточнение:

  Изменение баланса и запись в историю выполняются в одной транзакции. Это изменение
  должно происходить атомарно

  Если по одному заказы могут быть и начсиления и списание, то пожно добавить в историю
  поле operation_type, добавить его в индекс и тогда уникальными у нас будут order_id+operation_type'
takeaways:
- Описывать действия которые должны применится атомарно
