- В шагах вывода модели пользователь назвал сценарии чтения/записи и их интенсивность,
  атомарные изменения связанных данных, объём и размещение данных, характер данных;
  сущности с инвариантами и требования к согласованности явно не назвал.
- Пользователь описал механизмы пессимистической и оптимистической блокировки.
- Пользователь связал границу атомарности с размещением данных на одной машине и ценой
