prompt: 'Recall и understanding без материалов; application с разрешённым Course Reference.

  1) Recall: что такое инвариант в модели данных и как из пользовательских сценариев
  вывести требования к согласованности — где нужна строгая, а где допустима задержка?
  По одному примеру на каждый случай.

  2) Understanding: почему документная БД с атомарностью одного документа может быть
  удобнее SQL для моделирования агрегата, и в какой момент это преимущество перестаёт
  работать?

  3) Application: сервис продажи билетов на концерт — место нельзя продать дважды;
  выбранное место держится 10 минут на оплату, без оплаты освобождается; после оплаты
  билет появляется в «Мои билеты»; карту зала смотрят 1000+ раз в секунду. Сущности
  и инварианты, что меняется атомарно, где допустима задержка согласованности, какое
  хранилище и минимальные ключи/индексы.


  Уточнение: каким условием UPDATE исключить одновременный перехват одной истёкшей
  брони двумя пользователями? Что делает система, если оплата A пришла после истечения
  hold, когда место уже забрал B?'
answer: 'Первоначальный ответ:

  Инвариант это обязательное условие, выполнение которого мы должны гарантировать.

  Из пользользовательских сценариев можно вывести требования к согласованности через
  то, на сколько критично если пользователь увидит устаревшие данные. Пример строгой
  согласованности например лимит на покупку товара если мы не должны превысить этот
  лимит. Пример согласованности со временем - отзывы о товаре. Достаточно чтобы пользователь
  увидел свой отзыв если он его только что добавил, а чужие отзывы он может увидеть
  и задержкой

  Потому что проще реализовать атомарность. Мы можем представить агрегат в виде одного
  документа и атомарно его изменять. В SQL обычно агрегат представляет из себя набор
  данных в связанных таблицах и их атомарное изменение реализовать сложнее. Это преимущество
  перестает действовать если мы не можем представить агрегат в виде одного документа.
  Так как атомарность у нас только на уровне одного документа, то изменение нескольких
  документов может вызвать сложности

  Зал с местами

  Мероприятие

  Резервирование мест

  Пользователь

  Билеты пользователя

  Инварианты:

  Место на мероприятии может быть только в одном оплаченном билете

  Атомарно изменяется бронирование места и создание заказа на оплату билета.

  При показе карты зала допустима задержка. Актуализация может происходить при просмотре
  конкретного места

  Выбираем реляционную БД

  Таблицы:

  Seat: seat_id, hall_id, … первичный ключ seat_id, индекс по hall_id

  Reservation: reservation_id, event_id, seat_id, order_id, reservation_date, status.
  Первичный ключ reservation_id, уникальный индекс event_id+seat_id. Когда бронь истекая
  другой заказ может изменить запись вписав новый order_id и reservation_date

  Order: order_id, event_id, seat_id, user_id, created_at, status. Первичный ключ
  order_id, Индекс user_id


  Ответ на уточнение:

  При обновлении статуса резервирования мы проверяем, что в записи указан тот же номер
  закаказа, что и тот с которым мы работаем. Если там указан другой заказ, то обновление
  не срабатывает и мы откатываем оплату с оповещением пользователя'
takeaways:
- Документаная БД подходит для случаем, когда агрегаты можно полностью помещать у
  одном документе и нет размазывания агрегата по нескольким документам
