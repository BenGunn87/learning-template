- В сценарии пользователь назвал сущности, инвариант единственного оплаченного билета
  на место, уникальный индекс event_id+seat_id, перезапись истёкшей брони новым заказом,
  допустимую задержку карты зала с актуализацией при выборе места, реляционное хранилище
  и индекс заказов по user_id.
- Явного числового предела отставания карты зала пользователь не назвал.
