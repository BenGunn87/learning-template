recall:
  prompts:
  - Чем отличается момент ответа клиенту при асинхронной и синхронной репликации?
    Риск и цена каждого варианта.
  - Follower подтвердил запись в журнал. Вернёт ли чтение с него сразу новую версию?
  - Что такое replication lag, от чего растёт, как проявляется, пример операции и
    защита.
  - Почему реплики не заменяют резервную копию?
  answers:
  - Асинхронно — отвечаем после записи на лидере; быстрее, но если лидер упал до отправки
    на реплику, подтверждённые данные теряются. Синхронно — отвечаем после записи
    на лидере и реплике; запрос дольше, при падении реплики надо её ждать, но при
    падении лидера данные не потеряются.
  - Нет, запись в журнал ещё не означает применение изменений; между записью в журнал
    и доступностью для чтения есть задержка.
  - 'Задержка между записью на лидер и записью на реплику; растёт при большой нагрузке
    на запись или проблемах с сетью. Пользователь записал и сразу прочитал с реплики
    — видит старые данные, хотя запись успешна. Защита: после записи читать только
    с лидера.'
  - Неверные данные или удаление через репликацию распространятся на все реплики;
    резервная копия позволяет восстановить прежнее состояние.
practice:
  prompt: 'Сервис продажи билетов на концерты: кластер из leader и двух followers.
    Чтений каталога и схемы зала в ~50 раз больше, чем записей. Критичная запись —
    оплата и бронирование места: подтверждённую покупку нельзя потерять. После оплаты
    пользователь сразу открывает «Мои билеты». Нужно: (а) выбрать режим подтверждения
    для оплат и описать поведение при недоступности одного и обоих followers; (б)
    выбрать маршрут чтений для каталога и для «Моих билетов»; (в) описать, что происходит
    при отказе leader и что важно при выборе нового; (г) назвать цену решения.'
  answer: '(а) Синхронная репликация, чтобы не потерять информацию об оплате. Если
    недоступен один follower — ничего не произойдёт. Если оба — оплата не будет проходить,
    так как репликация не может быть выполнена. (б) Каталог и зал — на followers или
    любой узел кластера. «Мои билеты» — на leader, чтобы пользователь точно увидел
    только что купленный билет; во втором случае нельзя показать устаревшие данные.
    (в) Из followers выбирается новый leader. Надо проверить, что все последние изменения
    применены и доступны для чтения. Будет небольшой перерыв, так как переключение
    требует времени. Нужно гарантировать, что старый leader не начнёт снова принимать
    записи, когда станет доступен: он должен догнать нового leader и оставаться follower,
    пока не решим выполнить переключение. (г) Оплата выполняется дольше и может быть
    недоступна при проблемах с обоими followers.'
takeaways:
- 'При выборе типа репликации надо анализировать, что нам важнее: гарантии сохранения
  данных или скорость выполнения записи.'
- Чтение с реплики может возвращать старые данные. Это надо учитывать для операций,
  которые предполагают чтение сразу после записи.
- Переключение на реплику сопровождается даунтаймом.
