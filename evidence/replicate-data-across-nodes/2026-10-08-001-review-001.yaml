prompt: 'Без материалов.

  Recall: 1) Чем semi-synchronous (кворумное) подтверждение отличается от полностью
  синхронного и асинхронного? Что именно должно случиться с записью на follower до
  ответа клиенту?

  Understanding: 2) При синхронном подтверждении одним follower leader упал. Почему
  подтверждённая запись всё равно может потеряться и что обязательно учесть при выборе
  нового leader? 3) Follower получил журнал вовремя, но отстаёт по применению изменений.
  Как это проявится для клиента и чем отличается от сетевого отставания доставки?

  Application: 4) Сервис мессенджера: leader + 2 followers в той же зоне + 1 follower
  в другом регионе. Пользователь отправил сообщение и сразу видит ленту чата; собеседник
  в другом регионе читает свой чат; редактирование профиля. Выбери режим подтверждения
  записи, маршрут чтений для каждого сценария и объясни: что произойдёт при отказе
  leader, как защититься от split brain и какую цену (latency, нагрузка на leader,
  доступность) платишь.



  Уточнение. К 2: какую реплику опасно сделать новым leader — подтвердившую запись
  или другую, и почему? К 4: (а) каких followers ждёт leader до ответа, ждём ли follower
  в другом регионе; (б) с какого узла читаем ленту после отправки, чат собеседника
  в другом регионе, профиль после редактирования; (в) что мешает старому leader, не
  узнавшему о смещении, принимать записи; (г) цена решений из (а) и (б): задержка
  записи, нагрузка на leader, недоступность followers.'
answer: 'Первоначальный ответ:


  1) Полусинхронное подтверждение перед вовратом успешного ответа клиенту ждет подтвержение
  только от часть реплик, чтобы набралось количество необходимое для кворума. При
  синхронном подтверждении мы ждем подтверждение от всех рабочих реплик. При асинхронном
  подтверждении мы не ждем подтверждения от реплик.

  Обучно запись должна быть записан в журнал folllower-а. Применение идет уже потом.
  Самая жестка настройка это когда мы ждем подтверждения применения записи на реплике,
  чтобы она уже была готова на чтение

  2) Запись может потеряться есть мы выберем новым лидером реплику с котрой мы ждали
  подтверждения(если там в итоге запись не применилась), поэтому при выборе лидера
  надо выбирать реплику с самыми актуальными данными

  3) Даже при синжронной репликации клиент может увидеть старые данные после успешного
  подверждения записи. Это отличается от задержки доставки тем, что при задержке доставки
  мы ждем подтверждения от реплики и тем самым затягивается операция записи. В описанном
  случаи подтверждение приходит быстро и запись происходит без задержки

  4) Для отправки сообщения нам нужна read-your-write, и причинная согласованность

  для чтения нам нужна причинная согласованность

  для редактирования профиля нам нужна read-your-write согласованность

  При откаже leader выбрается новый leader из одного из fallowers этого региона и
  происходит переключение на него. Старый leader при востановлении становится follower-ом

  Лидером может стать фолловер из группы в которой есть как минимум два фоловера.
  Тем самым мы гарантируем что будет только один лидер

  Про цену не могу уверенно ответить



  Ответ на уточнение:


  Опстно выбирать ту реплику, которая ещё не подтвердила запись, так как нет гарантии
  что послдение данные были на неё записаны и это может привести к потере данных

  а) Ждем followers в основном регионе. В другом регионе не ждем, так как реплика
  из него не может стать лидером

  б) Ленту читаем с лидера, чтобы гарантировать что увидем своё сообщени

  Профиль читаем с лидера, чтобы видеть свои изменения

  Чат собеседника в другом регионе читаем с реплики своего региона

  в) Старый лидер должен дождаться подтверждения от фоловеров, но так как он отделен
  от них, то подтверждения нет и он понимает что он теперь не лидер

  г) У нас будет повышенная нагрузка на лидер так как только он обрабатывает запись
  и часть чтения для согласованности тоже идет через него. Так же присутствует задерка
  записи, так как мы ждем подтверждения с фоловеров.

  '
takeaways:
- Надо понимать в каких случаях нам нужно чтение с лидера.
- С каких реплик мы ждем подтветрждение, а с каких нет.
- Надо подробнее разобраться в механизме назначения лидера.
