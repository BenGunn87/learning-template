practice:
  prompt: 'Course Reference разрешён.

    Сервис электронных кошельков: leader в AZ-a, follower-1 в AZ-b, follower-2 в AZ-c
    (один регион, 1–2 мс между зонами), асинхронная реплика для аналитики в другом
    регионе. Сценарии: 1) перевод между кошельками — подтверждённое клиенту списание
    нельзя потерять при отказе любого одного узла; 2) пользователь сразу после перевода
    смотрит баланс и должен увидеть новую сумму; 3) поддержка смотрит историю операций,
    отставание в несколько секунд допустимо; 4) ночной финансовый отчёт. Требование:
    отказ любой одной AZ не должен останавливать приём переводов.

    (а) Режим подтверждения: каких реплик ждёт leader до ответа клиенту и почему не
    всех/не ни одной? (б) Маршрут чтений для сценариев 2, 3, 4. (в) Failover по шагам:
    какую реплику можно сделать новым leader, кто решает, что мешает старому leader
    принимать переводы? (г) Цена: задержка записи, нагрузка на leader, доступность
    записи; что если упадут обе AZ с followers?


    Уточнение: 1) упала только AZ-b — что с переводами при твоей схеме, и нужен ли
    другой режим, который не теряет подтверждённые записи? 2) в новом режиме у followers
    разный объём журнала — любого ли можно сделать leader, как выбрать, кто решает?
    3) связь пропала только между AZ-a и AZ-b, старый leader видит follower-2 и получает
    его подтверждения, в AZ-b назначили нового leader — что мешает старому продолжать
    подтверждать переводы?'
  answer: 'Первоначальный ответ:

    а) Ждем подтверждения реплик follower-1 и follower-2, чтобы при отказе лидера,
    могли переключится на одну из них и не потерять данные, для которых подтвердили
    запись. Не ждем все, так как этих реплик достаточно для восстановления и ожидание
    остальных только замедлит запись

    б) 2 - читаем с лидера

    3- можем читать с лидера или follower-1, follower-2

    4 - читаем с реплики для отчетов

    в) Лидером можно сделать одну из реплик follower-1 или follower-2. Старому лидеру
    мешает принимать переводы то, что при записи он ждет подтверждения от реплик,
    так как он отделен от них, то подтверждение не приходит и запись не совершается

    г) Наше решение увеличивает задержку при записи. Если обе реплики упадут, то запись
    перестанет работать, так как нет подтверждения записи не реплики


    Ответ на уточнение:

    Можно ждать подтверждения только от одной реплики чтобы при отключении второй
    мы могли продолжать записывать данные. Одной реплики нам достаточно, чтобы гарантировать,
    что данные не потеряются, при отказе лидера

    Не выбрал этот вариант, так при этом возникает вопрос, который ты описан во втором
    пункте. У нас может получится ситуация что часть записей есть на follower-1 но
    их нет на follower-2 и наоборот. Точно не знаю как в этом случае выполнять переключение.
    Могу предположить что его точно делает не человек, так как восстановление должно
    быть автоматическим. Скорее всего нам нужен координатор, который восстановит актуальное
    состояние на одном из follower добавив в него недостающие данные со второго follower
    и сделает его лидером

    3) Мы можем хранить версию лидера, реплики подтверждают запись только если операция
    пришла с актуальной версией лидера, поэтому старый лидер не будет получать подтверждение
    и не будет производить запись'
takeaways:
- Надо понять как решается проблема с разным набором данных на репликах
observations:
- Задание проверяло application узла leader-follower-replication.
- В первоначальном ответе выбрано ожидание обоих followers; конфликт с требованием
  продолжать запись при отказе одной AZ пользователь не заметил до уточнения.
- Маршруты чтений (баланс с leader, история с любого узла, отчёт с аналитической реплики)
  выбраны без подсказок.
- После уточнения пользователь предложил ожидание одной из двух реплик и указал, что
  этого достаточно для сохранности подтверждённой записи.
- Пользователь сообщил, что не знает, как выбирать нового leader при разном объёме
  журнала у followers; предположил, что followers могут содержать взаимно отсутствующие
  записи, и предложил автоматический координатор, объединяющий данные двух followers.
- На вопрос об изоляции старого leader пользователь предложил версию leader, по которой
  реплики отклоняют запись от устаревшего leader.
- Об использовании Course Reference пользователь не сообщал.
