practice:
  prompt: "Course Reference разрешён.\nПродажа билетов на концерты. Leader L и follower\
    \ F1 — в DC-1 (разные стойки); F2 — в DC-2 (~2 мс до DC-1);\nF3 — в DC-3 (~40\
    \ мс до DC-1). Требования: подтверждённое клиенту проданное место не теряется\
    \ при отказе\nлюбого одного ДЦ; при отказе любого одного ДЦ продажи продолжаются;\
    \ p99 записи < 30 мс.\n1) Каких подтверждений ждёт L перед ответом клиенту «место\
    \ ваше»? Подходит ли подтверждение от F1 для требований и почему?\n2) DC-1 упал\
    \ целиком (L и F1). Позиции журнала: F2 = 1050, F3 = 1047. Кого делать новым leader\
    \ и почему?\n   Что происходит с F3? Кто принимает решение о переключении?\n3)\
    \ Маршрут чтений: а) «Мои билеты» — клиент обновляет страницу сразу после оплаты;\n\
    \   б) схема свободных мест в зале, которую одновременно смотрят тысячи людей.\n\
    4) DC-1 восстановился. У старого L журнал до 1052, при этом 1051–1052 клиентам\
    \ не подтверждены.\n   Что делать со старым L и этими записями?\n"
  answer: 'Ждем подтверждения от двух фоловеров. Только от F1 не подходит, так как
    при падении всего DC-1 и мы можем потерять данные

    Новый лидер F2, так как у него журнал более полный. F3 остается репликой. Как
    понимаю решение по лидеру должен принимать внешний координатор, так как у нас
    произошло разделение провно поравну 2/2 и самим реплирам не понятно какая из груп
    главна

    а) Читаем с лидера

    б) Читаем с реплик. Не большая задерка в отображении не критична

    Эти записи откидываются. Старый лидер становится репликой до принятии решения
    о переключении

    '
takeaways:
- По существу все верно, но надо давать более полные ответы
