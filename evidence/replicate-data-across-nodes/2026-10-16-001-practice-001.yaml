  ≈ 40 мс) не рассмотрено.'
- 'П.2: новым leader выбран F2 по более полному журналу; F3 остаётся репликой (догон
  1048–1050 не упомянут); решающей стороной назван внешний координатор, так как оставшиеся
  2 из 4 узлов не образуют большинства.'
- 'П.3: «мои билеты» — чтение с leader; схема зала — с реплик с допустимой задержкой;
  проверка места на leader при покупке не упомянута.'
- 'П.4: неподтверждённые 1051–1052 отбрасываются, старый L становится репликой; механизм,
  не позволяющий старому L принимать записи (эпоха/fencing), и обрезка журнала до
  1050 не названы.'
- Обратная связь показана после ответа и до выводов.
