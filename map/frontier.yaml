format_version: 1

focus:
  primary: design-process
  secondary:
    - data-systems
    - reliability-and-operations

units:
  - id: frame-a-system-design-problem
    title: Frame a system design problem
    nodes:
      - design-process
      - requirements-analysis
      - functional-nonfunctional-requirements
      - tradeoff-analysis
    goal: >
      Научиться превращать размытое описание продукта в границы задачи,
      ключевые сценарии, качественные требования и явные компромиссы.
    estimated_minutes: 25
    priority: high

  - id: estimate-workload-and-capacity
    title: Estimate workload and capacity
    nodes:
      - capacity-estimation
      - latency-throughput
    goal: >
      Делать приближённые расчёты RPS, пиков, объёма хранения и пропускной
      способности, достаточные для выбора архитектурного направления.
    estimated_minutes: 25
    priority: high
    blocked_by:
      - frame-a-system-design-problem

  - id: trace-a-request-through-the-system
    title: Trace a request through the system
    nodes:
      - networking-basics
      - communication
      - compute-and-services
      - data-systems
    goal: >
      Построить целостную картину пути запроса от клиента через сеть и сервис
      до данных и отметить основные точки задержки и отказа.
    estimated_minutes: 25
    priority: high

  - id: model-data-and-access-patterns
    title: Model data and access patterns
    nodes:
      - data-modeling
      - transactions
      - sql-and-nosql
    goal: >
      Выводить модель данных и необходимые гарантии из сценариев чтения
      и записи, не выбирая технологию только по её категории.
    estimated_minutes: 25
    priority: high
    blocked_by:
      - frame-a-system-design-problem

  - id: choose-storage-and-indexes
    title: Choose storage and indexes
    nodes:
      - storage-selection
      - indexing
    goal: >
      Сравнить подходящие хранилища и индексы по запросам, согласованности,
      стоимости записи, масштабу и эксплуатационным рискам.
    estimated_minutes: 25
    priority: medium
    blocked_by:
      - model-data-and-access-patterns

  - id: scale-a-stateless-service
    title: Scale a stateless service
    nodes:
      - stateless-services
      - load-balancing
      - bottleneck-analysis
      - horizontal-scaling
    goal: >
      Объяснить, когда горизонтальное масштабирование помогает, как в нём
      участвует балансировщик и почему сначала нужно найти узкое место.
    estimated_minutes: 25
    priority: medium
    blocked_by:
      - estimate-workload-and-capacity
      - trace-a-request-through-the-system

  - id: design-for-partial-failures
    title: Design for partial failures
    nodes:
      - failure-models
      - timeout-retry-circuit-breaker
      - observability
    goal: >
      Спроектировать поведение сервиса при медленной или недоступной
      зависимости с помощью таймаутов, ограниченных повторов и наблюдаемости.
    estimated_minutes: 25
    priority: medium
    blocked_by:
      - trace-a-request-through-the-system
