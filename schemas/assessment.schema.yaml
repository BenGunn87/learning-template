$schema: https://json-schema.org/draft/2020-12/schema
$id: assessment.schema.yaml
title: Assessment event
type: object
additionalProperties: false
required:
  - format_version
  - id
  - evidence
  - type
  - created_at
  - result
  - gaps
  - summary
properties:
  format_version:
    const: 1
  id:
    type: string
    pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
  evidence:
    type: string
    pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
  type:
    enum:
      - initial
      - practice
      - review
      - reevaluation
  supersedes:
    type: string
    pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
  reason:
    enum:
      - user_request
      - contradiction
      - rubric_change
  created_at:
    type: string
    format: date-time
  result:
    type: object
    additionalProperties: false
    required:
      - recall
      - understanding
      - application
    properties:
      recall:
        $ref: '#/$defs/grade'
      understanding:
        $ref: '#/$defs/grade'
      application:
        $ref: '#/$defs/grade'
  gaps:
    type: array
    uniqueItems: true
    items:
      type: string
      minLength: 1
  summary:
    type: string
    minLength: 1
  observed_nodes:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: string
      pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
  evaluated:
    type: object
    minProperties: 1
    additionalProperties: false
    properties:
      recall:
        $ref: '#/$defs/evaluation'
      understanding:
        $ref: '#/$defs/evaluation'
      application:
        $ref: '#/$defs/evaluation'
  review_outcome:
    $ref: '#/$defs/grade'
allOf:
  - if:
      properties:
        type:
          const: reevaluation
      required: [type]
    then:
      required: [supersedes, reason]
    else:
      properties:
        supersedes: false
        reason: false
  - if:
      properties:
        type:
          const: review
      required: [type]
    then:
      required: [review_outcome]
    else:
      properties:
        review_outcome: false
$defs:
  grade:
    enum:
      - failed
      - hard
      - good
      - easy
  evaluation:
    type: object
    additionalProperties: false
    required: [nodes]
    properties:
      nodes:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: string
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
