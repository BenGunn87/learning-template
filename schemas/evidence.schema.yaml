$schema: https://json-schema.org/draft/2020-12/schema
$id: evidence.schema.yaml
title: Immutable learning evidence
type: object
additionalProperties: false
required: [format_version, id, unit, session, type, created_at, takeaways, observations]
properties:
  format_version: {const: 1}
  id:
    type: string
    pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
  unit:
    type: string
    pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
  session:
    type: string
    pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9]{3}$
  type:
    enum: [initial, practice, review]
  created_at:
    type: string
    format: date-time
  resource:
    type: object
    additionalProperties: false
    required: [title, url, type, language]
    properties:
      title: {type: string, minLength: 1}
      url:
        type: string
        format: uri
        pattern: ^https?://
      type:
        enum: [article, documentation, video, course, book, interactive]
      language: {type: string, minLength: 2}
  recall:
    type: object
    additionalProperties: false
    required: [prompts, answers]
    properties:
      prompts:
        type: array
        minItems: 1
        items: {type: string, minLength: 1}
      answers:
        type: array
        minItems: 1
        items: {type: string, minLength: 1}
  target:
    type: object
    additionalProperties: false
    required: [dimension]
    properties:
      dimension:
        enum: [recall, understanding, application]
  based_on:
    type: object
    additionalProperties: false
    properties:
      evidence:
        type: string
        pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
      previous_evidence:
        type: string
        pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
  practice:
    type: object
    additionalProperties: false
    required: [prompt, answer]
    properties:
      prompt: {type: string, minLength: 1}
      answer: {type: string, minLength: 1}
  prompt: {type: string, minLength: 1}
  answer: {type: string, minLength: 1}
  takeaways:
    type: array
    minItems: 1
    maxItems: 4
    items: {type: string, minLength: 1}
  observations:
    type: array
    items: {type: string, minLength: 1}
allOf:
  - if:
      properties:
        type: {const: initial}
      required: [type]
    then:
      required: [resource, recall, practice]
      properties:
        target: false
        based_on: false
        prompt: false
        answer: false
  - if:
      properties:
        type: {const: practice}
      required: [type]
    then:
      required: [target, based_on, practice]
      properties:
        resource: false
        recall: false
        prompt: false
        answer: false
        based_on:
          required: [evidence]
          properties:
            previous_evidence: false
  - if:
      properties:
        type: {const: review}
      required: [type]
    then:
      required: [based_on, prompt, answer]
      properties:
        resource: false
        recall: false
        target: false
        practice: false
        based_on:
          required: [previous_evidence]
          properties:
            evidence: false
