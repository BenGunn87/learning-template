$schema: https://json-schema.org/draft/2020-12/schema
$id: evidence.schema.yaml
title: Immutable learning evidence
type: object
additionalProperties: false
required:
  - format_version
  - id
  - unit
  - session
  - type
  - created_at
  - resource
  - recall
  - practice
  - takeaways
  - observations
properties:
  format_version:
    const: 1
  id:
    type: string
    pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
  unit:
    type: string
    pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
  session:
    type: string
    pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9]{3}$
  type:
    const: initial
  created_at:
    type: string
    format: date-time
  resource:
    type: object
    additionalProperties: false
    required:
      - title
      - url
      - type
      - language
    properties:
      title:
        type: string
        minLength: 1
      url:
        type: string
        format: uri
        pattern: ^https?://
      type:
        enum:
          - article
          - documentation
          - video
          - course
          - book
          - interactive
      language:
        type: string
        minLength: 2
  recall:
    type: object
    additionalProperties: false
    required:
      - prompts
      - answers
    properties:
      prompts:
        type: array
        minItems: 1
        items:
          type: string
          minLength: 1
      answers:
        type: array
        minItems: 1
        items:
          type: string
          minLength: 1
  practice:
    type: object
    additionalProperties: false
    required:
      - prompt
      - answer
    properties:
      prompt:
        type: string
        minLength: 1
      answer:
        type: string
        minLength: 1
  takeaways:
    type: array
    minItems: 1
    maxItems: 4
    items:
      type: string
      minLength: 1
  observations:
    type: array
    items:
      type: string
      minLength: 1
