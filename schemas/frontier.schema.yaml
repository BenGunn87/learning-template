$schema: https://json-schema.org/draft/2020-12/schema
$id: frontier.schema.yaml
title: Initial learning frontier
type: object
additionalProperties: false
required:
  - format_version
  - focus
  - units
properties:
  format_version:
    const: 1
  focus:
    type: object
    additionalProperties: false
    required:
      - primary
      - secondary
    properties:
      primary:
        type: string
        pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
      secondary:
        type: array
        uniqueItems: true
        items:
          type: string
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
  units:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - nodes
        - goal
        - estimated_minutes
        - priority
      properties:
        id:
          type: string
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        title:
          type: string
          minLength: 1
        nodes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        goal:
          type: string
          minLength: 1
        estimated_minutes:
          type: integer
          minimum: 5
        priority:
          enum:
            - high
            - medium
            - low
        blocked_by:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        routing_reasons:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            oneOf:
              - type: object
                additionalProperties: false
                required: [type]
                properties:
                  type:
                    const: primary-route
              - type: object
                additionalProperties: false
                required: [type, gap]
                properties:
                  type:
                    const: gap
                  gap:
                    type: string
                    pattern: ^gap-[a-z0-9]+(?:-[a-z0-9]+)*$
              - type: object
                additionalProperties: false
                required: [type, interest]
                properties:
                  type:
                    const: interest
                  interest:
                    type: string
                    pattern: ^interest-[a-z0-9]+(?:-[a-z0-9]+)*$
              - type: object
                additionalProperties: false
                required: [type]
                properties:
                  type:
                    enum: [context, diagnostic, user-override]
