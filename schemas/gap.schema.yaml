$schema: https://json-schema.org/draft/2020-12/schema
$id: gap.schema.yaml
title: Persistent learning gap
type: object
additionalProperties: false
required:
  - format_version
  - id
  - created_at
  - node
  - dimension
  - status
  - scope
  - routing_impact
  - signals
  - history
  - resolved_at
properties:
  format_version:
    const: 1
  id:
    type: string
    pattern: ^gap-[a-z0-9]+(?:-[a-z0-9]+)*$
  created_at:
    type: string
    format: date-time
  node:
    type: string
    pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
  dimension:
    enum: [recall, understanding, application]
  status:
    enum: [detected, confirmed, resolved, invalidated]
  scope:
    enum: [local, cross-concept]
  routing_impact:
    enum: [blocking, important, minor]
  signals:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [evidence, assessment, result, observed_nodes]
      properties:
        evidence:
          type: string
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        assessment:
          type: string
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        result:
          enum: [failed, hard]
        observed_nodes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
  history:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [status, at]
      anyOf:
        - required: [evidence]
        - required: [assessment]
      properties:
        status:
          enum: [detected, confirmed, resolved, invalidated]
        at:
          type: string
          format: date-time
        evidence:
          type: string
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        assessment:
          type: string
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        reason:
          enum: [reevaluation]
  remediations:
    type: array
    items:
      type: object
      additionalProperties: false
      required:
      - id
      - gap
      - session
      - unit
      - source_evidence
      - source_assessment
      - level
      - focus
      - misconceptions_addressed
      - guided_exercise
      - resource
      - completed_at
      properties:
        id:
          type: string
          pattern: ^remediation-[a-z0-9]+(?:-[a-z0-9]+)*$
        gap:
          type: string
          pattern: ^gap-[a-z0-9]+(?:-[a-z0-9]+)*$
        session:
          type: string
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9]{3}$
        unit:
          type: string
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        source_evidence:
          type: string
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        source_assessment:
          type: string
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        level:
          type: integer
          enum:
          - 1
          - 2
          - 3
        focus:
          type: string
          minLength: 1
        misconceptions_addressed:
          type: array
          uniqueItems: true
          items:
            type: string
            minLength: 1
        guided_exercise:
          type: boolean
        resource:
          oneOf:
          - type: 'null'
          - type: object
            additionalProperties: false
            required:
            - id
            - path
            properties:
              id:
                type: string
                pattern: ^resource-[a-z0-9]+(?:-[a-z0-9]+)*$
              path:
                type: string
                pattern: ^resources/generated/resource-[a-z0-9]+(?:-[a-z0-9]+)*\.md$
        completed_at:
          type: string
          format: date-time
  resolved_at:
    oneOf:
      - type: 'null'
      - type: string
        format: date-time
