$schema: https://json-schema.org/draft/2020-12/schema
$id: graph.schema.yaml
title: Knowledge graph
type: object
additionalProperties: false
required:
  - format_version
  - nodes
  - edges
properties:
  format_version:
    const: 1
  nodes:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - type
      properties:
        id:
          type: string
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        title:
          type: string
          minLength: 1
        type:
          enum:
            - area
            - topic
            - concept
        summary:
          type: string
        importance:
          enum:
            - core
            - supporting
            - optional
        tags:
          type: array
          uniqueItems: true
          items:
            type: string
            minLength: 1
        status:
          enum:
            - active
            - deprecated
        replaced_by:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
  edges:
    type: array
    items:
      type: object
      additionalProperties: false
      required:
        - from
        - to
        - type
      properties:
        from:
          type: string
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        to:
          type: string
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        type:
          enum:
            - part-of
            - prerequisite
            - related

