$schema: https://json-schema.org/draft/2020-12/schema
$id: learning.schema.yaml
title: Learning repository metadata
type: object
additionalProperties: false
required:
  - format_version
  - topic
  - learning_core
properties:
  format_version:
    const: 1
  topic:
    oneOf:
      - type: 'null'
      - type: object
        additionalProperties: false
        required:
          - id
          - title
        properties:
          id:
            type: string
            pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          title:
            type: string
            minLength: 1
  learning_core:
    type: object
    additionalProperties: false
    required:
      - version
    properties:
      version:
        type: string
        pattern: ^[0-9]+\.[0-9]+\.[0-9]+$
  created_at:
    type: string
    format: date
allOf:
  - if:
      properties:
        topic:
          type: object
      required:
        - topic
    then:
      required:
        - created_at

