$schema: https://json-schema.org/draft/2020-12/schema
$id: resource.schema.yaml
title: Generated learning resource metadata
type: object
additionalProperties: false
required:
  - format_version
  - id
  - type
  - format
  - created_at
  - unit
  - session
  - title
  - learning_goal
  - depth
  - coverage
  - sources
properties:
  format_version: {const: 1}
  id:
    type: string
    pattern: ^resource-[a-z0-9]+(?:-[a-z0-9]+)*$
  type: {const: generated}
  format: {const: article}
  created_at:
    type: string
    format: date-time
  unit:
    type: string
    pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
  session:
    type: string
    pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9]{3}$
  title: {type: string, minLength: 1}
  learning_goal: {type: string, minLength: 1}
  depth:
    enum: [overview, working, deep]
  coverage:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: string
      pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
  sources:
    type: array
    uniqueItems: true
    items:
      type: object
      additionalProperties: false
      required: [title, url]
      properties:
        title: {type: string, minLength: 1}
        url:
          type: string
          format: uri
          pattern: ^https?://
