$schema: https://json-schema.org/draft/2020-12/schema
$id: unit.schema.yaml
title: Initialized learning unit
type: object
additionalProperties: false
required:
  - format_version
  - id
  - title
  - nodes
  - goal
  - estimated_minutes
  - concepts
  - study_focus
  - practice
  - verification
properties:
  format_version:
    const: 1
  id:
    type: string
    pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
  title:
    type: string
    minLength: 1
  nodes:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: string
      pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
  goal:
    type: string
    minLength: 1
  estimated_minutes:
    type: integer
    minimum: 1
  concepts:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: string
      minLength: 1
  study_focus:
    type: array
    minItems: 2
    maxItems: 3
    uniqueItems: true
    items:
      type: string
      minLength: 1
  practice:
    type: object
    additionalProperties: false
    required:
      - type
      - goal
    properties:
      type:
        enum:
          - scenario
          - exercise
      goal:
        type: string
        minLength: 1
  verification:
    type: object
    additionalProperties: false
    required:
      - recall
      - understanding
      - application
    properties:
      recall:
        $ref: '#/$defs/check'
      understanding:
        $ref: '#/$defs/check'
      application:
        $ref: '#/$defs/check'
$defs:
  check:
    type: object
    additionalProperties: false
    required:
      - enabled
    properties:
      enabled:
        const: true
