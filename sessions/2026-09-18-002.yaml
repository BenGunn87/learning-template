  interaction:
    scenario: Спроектировать хранение для сервиса фоновых экспортов. Пользователь
      запускает экспорт, читает его состояние по ID и список своих последних экспортов.
      Воркеры забирают готовые задания; право обработки выдаётся как lease на 2 минуты.
      Воркер может зависнуть, lease истечёт, и задание заберёт другой воркер. Первый
      воркер способен поздно прислать завершение. Одно задание нельзя одновременно
      исполнять двум воркерам, а позднее завершение старого исполнителя не должно
      затереть состояние нового. Результат экспорта большой и хранится отдельно.
    prompt: Опишите сущности и главные паттерны чтения/записи; конкретный атомарный
      механизм выдачи lease при конкуренции; проверку владения при продлении и завершении,
      включая поздний ответ старого воркера; модель хранения, ключи и индексы; что
      можно обновлять асинхронно и главный компромисс решения.
    answers:
    - stage: application
      prompt: Опишите сущности и главные паттерны чтения/записи; конкретный атомарный
        механизм выдачи lease при конкуренции; проверку владения при продлении и завершении,
        включая поздний ответ старого воркера; модель хранения, ключи и индексы; что
        можно обновлять асинхронно и главный компромисс решения.
      answer: '1) Пользователь, задание на экспорт, результат экспорта. Чтение и запись
        конкретных заданий на экспорт, выборта списка экспортов. Чтени результатов
        экспорта из отдельного хранилища

        2) Для каждого воркаря мы генерируем уникальный токен. Когда он берет задание,
        то записывает в него этот токен и время начала. Брать можно новые задания
        или те, у которых время работы превысило 2 минуты. Начинаем работу только
        после успешно записи токена в БД. Можно применить оптимистичную конкуренцию
        и обновлять запись только если текущий токен пустой или тот же(старый), который
        мы получили при чтении

        3) При записи результата мы делаем update только если в задании по прежнему
        установлен наш токен

        4) Задания храним в реляционной БД. В заданиях есть индекс по пользователю,
        по статусу и дате обновления. Результаты храним у отдельном двоичном хранилище.
        Асинхронно у нас будет обновляться данные о результатах экспорта

        Главный коспромис в том, что зависший воркер в итого может закончить экспорт,
        но его результаты мы не сохраняем. Получается в хранилище экспортов будут
        файлы к которым в реальности не будет доступа, т.е. в пустую тратим часть
        места в хранилище'
    - stage: application_followup
      prompt: 'Какие условия должны быть в UPDATE при продлении lease и при завершении
        задания? Воркер сначала загрузил файл в объектное хранилище, но условный UPDATE
        не прошёл: что делать с таким файлом и как публиковать ссылку на успешный
        результат?'
      answer: '1) Я бы проверял только токен. Если задание ещё никто не брал, то даже
        при истечении времени мы можем сохранить результат

        2) Ссылку не публикуем. Если update не прошел, то можно сделать механиз удаления
        такого файла. Тут зависит от реализации, либо сам воркер это делает, либо
        сохраняем ссылку в список на удаление'
    takeaways:
    - Удобно использовать уникальный токен чтобы подтверждать владение.
    - Сразу продумывать вариант, если опреация закончилась неуспехом.
  note: Практика и пользовательские выводы завершены.
