    title: От паттернов доступа к хранилищу и индексам
    format: article
    language: ru
    estimated_minutes: 9
    difficulty: intermediate
    status: completed
  interaction:
    prompt: 1. Какие ограничения определяют выбор хранилища? 2. Как левый префикс
      определяет использование составного индекса? 3. Какова цена дополнительного
      индекса?
    scenario: 'Спроектировать PostgreSQL-хранение складских остатков: чтение по складу
      и SKU, атомарная резервация нескольких SKU, выборка дефицитных товаров, история
      изменений; определить ключи, индексы, конкурентную защиту, отвергнутую альтернативу,
      цену индексов и измеримый сигнал пересмотра.'
    answers:
    - stage: recall
      prompt: Какие ограничения определяют выбор хранилища?
      answer: Операции чтения и записи, атомарно изменяемые данные, форма схемы, масштаб
        и необходимость распределения, экспертиза и технические возможности команды.
    - stage: recall
      prompt: Как используется составной индекс с tenant_id, status и created_at?
      answer: Индекс полезен по левому префиксу. Без tenant_id он существенно хуже;
        без status сузит выборку по tenant_id, но переберёт записи tenant для created_at.
    - stage: recall
      prompt: Какова цена дополнительного индекса?
      answer: Замедление записей, дополнительное место и память, усложнение планирования;
        редко используемый индекс со слабым ускорением можно удалить.
    - stage: practice
      prompt: Предложите решение для сервиса складских остатков.
      answer: PostgreSQL; отдельные таблицы текущих остатков и истории. Primary key
        (warehouse_id, sku), индекс (warehouse_id, available_qty ASC), для истории
        (warehouse_id, sku, date DESC). В транзакции уменьшать остатки, писать историю
        и резервирование. Wide-column отвергнута из-за достаточности PostgreSQL и
        отсутствия опыта. P99 записи выше SLO — сигнал пересмотра.
    - stage: practice
      prompt: Уточните optimistic locking для нескольких SKU.
      answer: Обновлять записи только если текущее количество совпадает с прочитанным
        перед операцией. Если хотя бы одно значение не совпало, откатить все изменения
        и повторить операцию с начала.
    takeaways:
    - Если нет явных ограничений, то сначала лучше использовать реляционную БД, и
      только при возникновении проблем начинать делать денормализацию, переходить
      к NoSQL-решениям и так далее.
    - 'Индексы не только ускоряют чтение, но и имеют накладные расходы: замедляют
      запись, потребляют память и место в кэше. Перед добавлением индекса надо понимать,
      что конкретно мы ускоряем.'
    - В составном индексе надо помнить, что поля рассматриваются слева направо.
    - При переходе к шардированию надо внимательно выбирать ключ шардирования, чтобы
      минимизировать операции между шардами.
  note: Полная независимая проверка и пользовательские Takeaways завершены. Checkpoint
