  interaction:
    prompt: 'Сервис бронирует переговорные комнаты. Есть комнаты (room_id, building_id,
      capacity) и брони (room_id, start_at, end_at, status). Нужны: история броней
      одной комнаты по времени; поиск доступных комнат здания на интервал; запрет
      двух пересекающихся подтверждённых броней одной комнаты даже при одновременных
      запросах. Ожидается до 1 млн броней и 100 записей/с. Кратко ответьте: какие
      группы ограничений выяснить перед выбором хранилища; какое основное хранилище
      и минимальные ключи/индексы выбрать и почему; как обеспечить запрет пересечений
      при конкуренции; какова цена дополнительного индекса и когда решение стоит пересмотреть?'
    scenario: 'Уточнение: два параллельных запроса проверили один интервал и оба увидели,
      что броней нет. Какой конкретный механизм гарантирует, что подтвердится только
      одна бронь? Из предложенных индексов какие нужны для двух заданных чтений, а
      какие можно не добавлять сразу? Назовите одну цену индекса и измеримый повод
      пересмотреть выбор.'
    answers:
    - stage: initial
      answer: 1) Поместится ли информация на одно машину. Если да то выбираем реляционную
        БД. Для первой таблице ключ room_id. Для второй таблицы нужен синтетический
        ключ booking_id Индексы для второй таблицы room_id, start_at ASC, status,
        второй инедкс room_id end_at ASC, status Индексы первой таблицы building_id
        Запрет на подтверждение брони делаем через оптимистическую блокировку. При
        инсерте проверяем нет ли в базе уже записей на это же время и если есть, то
        откатываем транзакцию
    - stage: followup
      answer: 1) При инсерте добавляется WHERE NOT EXISTS. Соответственно первый запрос
        отработает, а второй увидет, что комната уже занята и откатится 2) Я бы оставил
        все индексы. Цена в увеличении времени вставки бронирования и необходимого
        места на диске. Пересмотрим при увеличении времени бронирования P99 некоего
        порогового значения
    takeaways:
    - При вставке ного значения оптимистическую блокировку можно сделать через WHERE
      NOT EXISTS
