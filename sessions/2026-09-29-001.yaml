  note: 'Проверка завершена: recall, практика и takeaways получены.'
  interaction:
    scenario: 'Сервис продажи билетов на концерты: кластер из leader и двух followers.
      Чтений каталога и схемы зала в ~50 раз больше, чем записей. Критичная запись
      — оплата и бронирование места: подтверждённую покупку нельзя потерять. После
      оплаты пользователь сразу открывает «Мои билеты». Нужно: (а) выбрать режим подтверждения
      для оплат и описать поведение при недоступности одного и обоих followers; (б)
      выбрать маршрут чтений для каталога и для «Моих билетов»; (в) описать, что происходит
      при отказе leader и что важно при выборе нового; (г) назвать цену решения.'
    answers:
    - stage: recall
      prompt: Чем отличается момент ответа клиенту при асинхронной и синхронной репликации?
        Риск и цена каждого варианта.
      answer: Асинхронно — отвечаем после записи на лидере; быстрее, но если лидер
        упал до отправки на реплику, подтверждённые данные теряются. Синхронно — отвечаем
        после записи на лидере и реплике; запрос дольше, при падении реплики надо
        её ждать, но при падении лидера данные не потеряются.
    - stage: recall
      prompt: Follower подтвердил запись в журнал. Вернёт ли чтение с него сразу новую
        версию?
      answer: Нет, запись в журнал ещё не означает применение изменений; между записью
        в журнал и доступностью для чтения есть задержка.
    - stage: recall
      prompt: Что такое replication lag, от чего растёт, как проявляется, пример операции
        и защита.
      answer: 'Задержка между записью на лидер и записью на реплику; растёт при большой
        нагрузке на запись или проблемах с сетью. Пользователь записал и сразу прочитал
        с реплики — видит старые данные, хотя запись успешна. Защита: после записи
        читать только с лидера.'
    - stage: recall
      prompt: Почему реплики не заменяют резервную копию?
      answer: Неверные данные или удаление через репликацию распространятся на все
        реплики; резервная копия позволяет восстановить прежнее состояние.
    - stage: practice
      prompt: (а) Режим подтверждения для оплат; поведение при недоступности одного
        и обоих followers.
      answer: Синхронная репликация, чтобы не потерять информацию об оплате. Если
        недоступен один follower — ничего не произойдёт. Если оба — оплата не будет
        проходить, так как репликация не может быть выполнена.
    - stage: practice
      prompt: (б) Маршрут чтений каталога и «Моих билетов».
      answer: Каталог и зал — на followers или любой узел кластера. «Мои билеты» —
        на leader, чтобы пользователь точно увидел только что купленный билет; во
        втором случае нельзя показать устаревшие данные.
    - stage: practice
      prompt: '(в) Отказ leader: что происходит, что проверить при выборе нового,
        будет ли перерыв.'
      answer: 'Из followers выбирается новый leader. Надо проверить, что все последние
        изменения применены и доступны для чтения. Будет небольшой перерыв, так как
        переключение требует времени. Нужно гарантировать, что старый leader не начнёт
        снова принимать записи, когда станет доступен: он должен догнать нового leader
        и оставаться follower, пока не решим выполнить переключение.'
    - stage: practice
      prompt: (г) Цена выбранных гарантий.
      answer: Оплата выполняется дольше и может быть недоступна при проблемах с обоими
        followers.
    takeaways:
    - 'При выборе типа репликации надо анализировать, что нам важнее: гарантии сохранения
      данных или скорость выполнения записи.'
    - Чтение с реплики может возвращать старые данные. Это надо учитывать для операций,
      которые предполагают чтение сразу после записи.
    - Переключение на реплику сопровождается даунтаймом.
