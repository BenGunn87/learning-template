  interaction:
    prompt: 'Платформа онлайн-курсов по подписке. Пользователь оформляет месячную
      подписку через внешнего платёжного провайдера; провайдер сам делает рекуррентные
      списания и шлёт webhook об успехе или неудаче (webhook может прийти повторно
      или с задержкой). После успешной оплаты доступ к урокам должен открыться в течение
      нескольких секунд. При неудачном продлении действует grace period 3 дня, затем
      доступ закрывается. Студент смотрит видео-уроки (видео отдаёт CDN), backend
      хранит прогресс; при прохождении всех уроков выдаётся PDF-сертификат — ровно
      один на курс. Раз в месяц авторам считается отчёт с выплатами по просмотрам;
      расчёт не должен замедлять просмотр уроков. Над backend работают две небольшие
      команды: «платежи и подписки» и «контент и обучение».


      1. Предложи минимальный набор сервисов/модулей и владельца данных для каждого:
      где живут подписка, право доступа, прогресс, сертификат, данные для отчёта?

      2. Какие взаимодействия синхронные, а какие асинхронные? Как сервис уроков проверяет
      доступ и что происходит, если владелец подписок в этот момент недоступен?

      3. Как обработать повторный/поздний webhook, окончание grace period и сбой генерации
      сертификата так, чтобы не выдать второй сертификат?

      4. Для каждого выделенного отдельного сервиса назови его цену, и одну границу,
      которую ты сознательно оставил модулем внутри сервиса, — почему.'
    scenario: 'Уточнение: 1) Назови цену каждого отдельного сервиса (авторизация,
      статика, аналитика, подписки, обучение): что именно усложняется и оправдано
      ли пять сервисов при двух командах? 2) Сертификат: генерация PDF упала посередине,
      а пользователь (или ретрай воркера) запускает её снова; два запроса пришли параллельно.
      Какие состояния и ограничения в БД гарантируют ровно один сертификат на (пользователь,
      курс) и что делать с недогенерированным файлом?'
    answers:
    - stage: initial
      answer: "1) Сервисы: \nСервис для авторизации - проверяет авторизацию пользователей.\
        \ Хранит данные о пользователях: ученик, автор, админ и т.д.\nПодписка и платежи\
        \ - владет данные о подписке пользователя и обрабатывает взаимодействие с\
        \ платежной системой\nСервис для обучения - Хранит данные о курсах, прогресс\
        \ обучение, наличее сертификатов\nСервис для хранения статики - видео, PDF-сертификаты\
        \ и т.д. \nАналитикика - отдельный сервис, которые строит отчет. Работает\
        \ с отдельной БД, куда реплицируются данные из основных БД\n2) Сервис обучения\
        \ синхронно отправляет запрос в сервис подписок и проверяет, есть ли у пользователя\
        \ подписка. Можно сделать кеш, чтобы сохранять туда данные о подписе до срока\
        \ её истечение, чтобы не ходить туда часто. При отмене подписки предусмотреть\
        \ получении сообщения об этом и инвалидацию кэша. Если сервис подписок не\
        \ доступен но есть информация в кеше, даем проходить обучение. Если информации\
        \ в кеше нет, то не даем\nВзаимодействие с платежной системой происходит асинхронно\
        \ \n3) Взаимодействие с плетежной системой асинхронное, поэтому задержка не\
        \ критична. Мы делаем получение вебхука иденпотентным, чтобы корректно обрабатывать\
        \ повторный вебхук\nПосле окончания grace period при очередном запросе к сервису\
        \ подписок сервис очения получи информацию о том, что подписка истекла и закроет\
        \ доступ\nНе очень понял про сбой. Мы можем один раз генерировать сертификат\
        \ и сохранять его в файловое хранилише. В БД храним ссылку на сертификат,\
        \ тем самым каждый раз пользователю у нас будет показываться один и тот же\
        \ сертификат\n4) Оставил в сервисе для обучения функционал для администрирования\
        \ курсов. Можно сделать это отдельным моделем, но не отдельным сервисов. Сделал\
        \ так чтобы пока не разделять данные на те которые для редактирования и те\
        \ которые для чтения"
    - stage: followup
      answer: "1) Сервис авторизации - тут у нас общая логика. Лучше держать её в\
        \ одном месте. Она не будет часто изменятся, так что не критично. Модет поддерживать\
        \ каманда платеже. Критичность в том, что при проблемах с этим сервисом будет\
        \ проблема к доступу ко всей системе. Так же в обработку запросов  добавлется\
        \ запрос на проверку авторизации. Можно реализовать в виде gateway\nПодписка\
        \ и платежи - поддерживается командой платежей. Цена в том, что для проверки\
        \ подписки приходится делать запрос в этот сервис. Для инвалидации кеша нужен\
        \ либо общий кеш с сервисом обучения либо дополнительнео взаимодействие между\
        \ ними(например через сообщения).\nСервис для обучения - команда обучения.\
        \ Хранит все данные для обучения\nСервис для хранения статики - команда обучение.\
        \ Может быть вообще внешним сервисом, так что надо будет только настроить\
        \ взаимодействи с ним\nАналитикика - команда обучения или платежей, надо посмотреть\
        \ по их загрузке. Отдельный сервис так как по смыслу это другая работа с данными\
        \ со своим хранилищем и т.д. \nБольшое количетво сервисов осножняет опреирование\
        \ ими, поддержание и т.д. Но нато можно по разному их масштабировать\n2) Можно\
        \ сделать отдельную таблицу для сертификатов с полями sert_id, user_id, course_id,\
        \ url. По user_id+course_id делаем уникальный индекс. Тогда мы не сомжем записать\
        \ в БД информацию о двух сертификатах\nНедосозданный файл игнорируется. Можно\
        \ сделать сборщик мусора, который периодичестки будет проверять, сохранена\
        \ ли ссылка на файл в таблице с сертификатами и если нет, то удалять его"
    takeaways:
    - Давать более полные ответы )
