  interaction:
    prompt: 'Recall и понимание, без материалов, своими словами.

      1) Назови не меньше четырёх моделей согласованности и одной фразой — что каждая
      обещает клиенту.

      2) Что утверждает CAP и что к нему добавляет PACELC?

      3) Почему в схеме leader–follower пользователь может не увидеть собственную
      только что сделанную запись? Предложи два способа обеспечить read-your-writes.

      4) Почему линеаризуемая запись между регионами медленнее даже без сбоев, а read-your-writes
      можно обеспечить почти без этой цены?'
    scenario: 'Практика. Мультирегиональная игровая платформа (EU и US, у каждого
      своя реплика; игрок обычно подключается к ближайшему региону, но может сменить
      его). Операции: a) покупка предмета за внутреннюю валюту — баланс не уходит
      в минус, есть лимитированные предметы (100 штук на весь мир); b) смена никнейма
      и аватара — ник уникален глобально; c) глобальная таблица лидеров, обновляется
      после каждого матча; d) чат гильдии с участниками в обоих регионах; e) счётчик
      «игроков онлайн» на главной. 1) Какую минимальную гарантию согласованности назначишь
      каждой операции и почему, какое нарушение недопустимо? 2) Связь EU–US пропала
      на 10 минут: что происходит с каждой операцией на каждой стороне — отказ, работа
      на старых данных или накопление и последующее слияние? 3) Цена выбора в задержке
      при нормальной работе и какую операцию стоит разделить на части с разными гарантиями?
      Также дописать второй способ обеспечить read-your-writes.


      Уточнение: 1) Для чата выбран consistent prefix, но при разделении обе стороны
      продолжают принимать сообщения и потом сливают — совместимо ли это с единым
      порядком всех сообщений, и какая модель подходит? 2) Нужна ли глобальная координация
      для баланса одного игрока, если у каждого игрока есть домашний регион, и что
      тогда отказывает при разделении? Как сохранить продажи лимитированного предмета
      хотя бы частично доступными? 3) При двух регионах нет большинства: какая сторона
      продолжает принимать смену ника, а какая отказывает?'
    answers:
    - stage: recall
      answer: "1) Точных название могу не вспомнить\nстрогая согласованнность - после\
        \ успешной записи все клиенты могут прочитать только новое значение\nсогласованность\
        \ со временем - если объект не меняется, то через какое-то время все клиенты\
        \ начнут получать новое значение\nмонотонное чтение - если клиент прочитал\
        \ значение, то при повторном чтении он не может увидеть более старое значение\n\
        согласованность внутри сессии - если клиент записал значение, то в нутри этой\
        \ же сессии он всегда будет читать уже новое значение. При это другие клиенты\
        \ могу всё ещё читать старое значение\n2) CAP утверждает что в систмах устойчивых\
        \ к сетивому разделения вы выбираем между дву способами работы при разделении.\
        \ С - консистентность - меньша часть системы начинает отвечать ошибкой на\
        \ попытку записать или прочитать данные \nA - доступность - система остается\
        \ полностью доступной у её отдельные часть мугут стать не консистетными\n\
        CAP говорит только о случаи разделения. PACELC дополняет её тем, что и без\
        \ разделения у нас есть цена. При CP операция записи будет происходить дольше.\
        \ При AP даже без разделения часть клиентов может видель устаревшие данные\
        \ \n3) Это может произойти например если у нас асихронная репликация и пользователь\
        \ читает с follower. Эту проблему можно решить, если сделать так чтобы после\
        \ записи пользователь читал только с leader\n4) Потому что для её обеспечения\
        \ надо дожидаться когда данные будут записаны в необходимое число узлов. read-your-writes\
        \ можно обеспечить тем, что пользователь подключается к конкретному региону,\
        \ тогда нам не надо ждать записи в других регионах, но при этом так как мы\
        \ пишем и читаем в одном регионе пользователь всегда видет актуальные для\
        \ него данные"
    - stage: practice
      answer: '3) Сделать синхронну репликацию с подтверждением лоступность данных
        на реплике. Тогда нам не важно откуда читать, но при этом запись будет происходить
        медленнее


        1) a, b - строгая согласованность, так как есть ограничения, которые мы не
        можем нарушать. В b изменения аватара можне вынести в согласованность когда-нибудь,
        так как ограничение действует только на никнейм

        d - согласованность по префиксу, чтобы порядок сообщений не путался

        с - не знаю на сколько критична эта таблица. Я бы делал её согласованной по
        read-your-write чтобы игрок мог видеть как его матч повлиял на таблицу

        e - согласованность со временем, так как не критичный показатель

        2) a,b - отказывает

        c, d, e - накапливает данные и потом сливается

        3) a и b будут работать с задежкой. Как и писал выше b можно разделить на
        изменение никнейма(строгая согласованность) и аватара(согласованность со временем)'
    - stage: practice-followup
      answer: '1) Тут затрудняюсь ответить. Предполагал что при слиянии у нас сообшения
        выстроятся по времени их отправки, но понимаю что это не очень удачное решение

        2) Мне кажется что глобальная координация нужна, так как сейчас легко с помошью
        VPN изменить регион и тогда игроки могут воспользльзоваться ситуаций и потратить
        балансы дважды. Если это не критично, то можно остановится на read-your-write
        которую легко обеспечить так как игрок пишет и читает в рамках одного региона

        Прожаду лимитированного товара можно оставить частично доступной введя разделение
        остатков. Например при разделении считаем что 50% от того что до этого оставалось
        можно продать в EU и 50% продать в US. При таком подходе на не вйдем за лимиты,
        только уменьшим доступный лимит в каждом регионе

        3) Я бы зарание вбрал, какой регион будет лидером и на стороне лидера продолжал
        принемать изменение ника'
    takeaways:
    - Гарантии согласованность надо рассматривать на уровне операций
    - В кап теореме мы выбираем как реагировать на разделение системы
    - Часто можно решить проблему выбрав подходящего лидера и тем самым обеспечив
      работоспособность системы в большинстве случаев
  discussion_summary:
    questions_raised:
    - В чём принципиальная разница между causal consistency и consistent prefix?
    - Что означает P в CAP и какие системы относятся к CP и AP?
    clarifications:
    - Consistent prefix опирается на один общий порядок всех записей (лог) и показывает
      его префикс; causal упорядочивает только причинно связанные операции, а параллельные
      независимые реплики могут показывать в разном порядке.
    - Модели несравнимы по одной линейке, как подано в статье; causal включает сессионные
      гарантии и совместима с записью на нескольких лидерах, consistent prefix требует
      единого порядка записи.
    - 'P — сетевое разделение: узлы живы, но сообщения между ними теряются или задерживаются
      неограниченно; узел не отличает медленного соседа от недоступного. Разделение
      не выбирают, поэтому выбор при нём — между C и A; CA имеет смысл только без
      сети.'
    - 'CP: etcd, ZooKeeper, Consul (меньшинство отказывает); AP: Cassandra, DynamoDB-подобные
      хранилища, Riak, DNS; метка зависит от настроек операции.'
    assessment_focus:
    - Различие полного и частичного порядка в моделях согласованности.
    - Поведение стороны меньшинства и большинства при сетевом разделении.
