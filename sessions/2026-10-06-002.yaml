  interaction:
    prompt: 'Сервис бронирования ресторанов с двумя регионами: Asia (Сингапур) и EU
      (Франкфурт), у каждого своя реплика данных. Пользователь подключается к ближайшему
      региону, но часто путешествует. Каждый ресторан физически находится в одном
      регионе.


      Операции:

      a) Обсуждение под отзывом: гость пишет отзыв, владелец ресторана отвечает, гость
      отвечает на ответ. Обсуждения под разными отзывами независимы. Пишут участники
      из обоих регионов.

      b) Подарочный баланс пользователя: тратится при оплате брони в любом ресторане
      сети, в минус уйти не может.

      c) Бронирование конкретного столика на конкретное время: двух броней одного
      столика на одно время быть не может.

      d) Средний рейтинг ресторана в карточке.

      e) Пользователь меняет настройки уведомлений и сразу открывает экран настроек.


      1) Какую минимальную гарантию согласованности назначишь каждой операции и какое
      нарушение для неё недопустимо?

      2) Связь Asia–EU пропала на 15 минут. Для каждой операции: что происходит на
      стороне Asia и на стороне EU (отказ, работа на старых данных или накопление
      с последующим слиянием)? Укажи, какая сторона продолжает работать.

      3) В каком порядке показывать сообщения в обсуждении (a)? Почему не по времени
      создания, которое ставит устройство автора?

      4) Цена выбранных гарантий в задержке при нормальной работе: какие операции
      платят межрегиональный round-trip, а какие нет?

      '
    answers:
    - stage: initial
      answer: "1)\na) Причинная согласованность, чтобы сообщения из обсуждения под\
        \ отзывом отображались в верном порядке. При разрыве продолжаем накапливая\
        \ данные \nb) Линеаризуемость, чтобы не уходит в минус. Для каждого пользователя\
        \ храним его основной регион. При разрыве соединения пользователь может тратить\
        \ баланс только в своем основном регионе\nс) Линеаризуемость, чтобы не было\
        \ двайного бронирования. При разрыве соединения операция работает в регионе\
        \ ресторана. В другом регионе не работает\nd) Согласованность со временем.\
        \ При разрыве накапливаем и синхранизируем\ne) read-your-write. При разрыве\
        \ накапливаем и потом синхранизируем \n3) Делаем причинную согласованность.\
        \ Нельзя использовать время, так как время на разных серверах может быть не\
        \ согласовано\n4) b и с платят задержкой за межрегиональный round-trip, Остальные\
        \ нет\n"
    - stage: clarification
      prompt: 'Уточнение: 1) Как конкретно обеспечить причинный порядок в обсуждении
        (a): какие данные несёт сообщение и когда реплика показывает ответ? Что видит
        участник в Asia во время разрыва? 2) Всегда ли b и c платят межрегиональный
        round-trip? От чего это зависит?'
      answer: '1) Каждое сообщение несет информацию о том какое сообщение было до
        него. Репоика может показать ответ если в ней есть запись об вопросе. При
        разрыве участники видят сообщения своего региона

        2) Задерки не будет каогда работа идет в "родном регионе". Там мы можем записывать
        без ожиданий записи в другом регионе, так как при разрыве в другом регионе
        операции не будут доступны'
    takeaways:
    - Надо помнить про линеаризуемость, монатонном чтении и записи, read-your-write.
    - Помнить про принцип с родными регионом
  note: Targets previous application gaps — causal vs consistent prefix and timestamp
    ordering, per-entity home-leader linearizability instead of session guarantees,
    explicit partition-side behavior.
