format_version: 1
id: choose-consistency-under-failures
title: Choose consistency under failures
nodes:
- consistency-models
- availability-consistency-tradeoff
- eventual-consistency
goal: 'Для каждой операции системы выбирать минимально необходимую гарантию согласованности
  (линеаризуемость, read-your-writes, monotonic reads, causal, eventual) и объяснять,
  как этот выбор влияет на доступность и задержку при отказах реплик и сетевых разделениях.

  '
estimated_minutes: 25
concepts:
- модели согласованности как гарантии наблюдаемых версий данных
- линеаризуемость (strong consistency)
- сессионные гарантии read-your-writes и monotonic reads
- причинная согласованность
- eventual consistency, сходимость и разрешение конфликтов
- CAP при сетевом разделении и PACELC в нормальной работе
- выбор гарантии на уровне операции, а не всей системы
study_focus:
- Чем различаются линеаризуемость, сессионные гарантии и eventual consistency с точки
  зрения того, что может увидеть клиент?
- Почему при сетевом разделении системе приходится выбирать между отказом в операции
  и возможностью вернуть устаревшие или конфликтующие данные, и какую цену имеет каждый
  вариант даже без отказов?
- Как определить для конкретной операции, какое нарушение согласованности недопустимо
  для бизнеса, а какое приемлемо?
practice:
  type: scenario
  goal: 'Для сервиса с несколькими типами операций, развёрнутого на нескольких репликах
    или регионах, назначить каждой операции необходимую гарантию согласованности,
    описать поведение при сетевом разделении и объяснить цену выбора в доступности
    и задержке.

    '
verification:
  recall:
    enabled: true
  understanding:
    enabled: true
  application:
    enabled: true
