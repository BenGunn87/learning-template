format_version: 1
id: choose-storage-and-indexes
title: Choose storage and indexes
nodes:
- storage-selection
- indexing
goal: Выбирать класс основного хранилища и минимальный набор индексов из конкретных
  паттернов чтения и записи, требований к атомарности, масштаба и эксплуатационных
  ограничений, явно называя цену решения.
estimated_minutes: 25
concepts:
- выбор хранилища от паттернов доступа и гарантий
- первичный ключ и направление основных запросов
- составные индексы и порядок полей
- селективность и покрывающие индексы
- стоимость индексов для записи, памяти и эксплуатации
- признаки того, что выбранную модель пора пересмотреть
study_focus:
- Какие паттерны доступа и инварианты сильнее всего ограничивают выбор хранилища?
- Как из фильтрации, диапазона и сортировки вывести ключ и порядок полей составного
  индекса?
- Как оценить выигрыш чтения относительно стоимости записи, памяти и эксплуатационной
  сложности?
practice:
  type: scenario
  goal: Для нового backend-сценария выбрать основное хранилище, ключи и минимальный
    набор индексов, затем объяснить отвергнутые альтернативы и главный эксплуатационный
    компромисс.
verification:
  recall:
    enabled: true
  understanding:
    enabled: true
  application:
    enabled: true
