format_version: 1
id: decompose-a-backend-system
title: Decompose a backend system
nodes:
- architecture-decomposition
- service-architecture
- tradeoff-analysis
goal: 'Разложить backend-систему на компоненты, потоки данных и границы ответственности,
  а затем обосновать границы компонентов через требования, связанность и ключевые
  архитектурные компромиссы.

  '
estimated_minutes: 25
concepts:
- декомпозиция от сценариев и требований
- компоненты и границы ответственности
- синхронные и асинхронные потоки данных
- владение данными и источники истины
- связанность, когезия и стоимость распределённости
- архитектурные компромиссы и эволюция границ
study_focus:
- По каким признакам выделять компоненты и проводить между ними границы ответственности?
- Как потоки данных и владение данными помогают проверить качество декомпозиции?
- Когда разделение на сервисы оправдано, а когда создаёт лишнюю распределённую сложность?
practice:
  type: scenario
  goal: 'Декомпозировать backend заданного продукта на минимальный набор компонентов,
    показать основные синхронные и асинхронные потоки, назначить владельцев данных
    и объяснить один осознанный компромисс выбранных границ.

    '
verification:
  recall:
    enabled: true
  understanding:
    enabled: true
  application:
    enabled: true
