format_version: 1
id: estimate-workload-and-capacity
title: Estimate workload and capacity
nodes:
- capacity-estimation
- latency-throughput
goal: 'Уметь быстро переводить продуктовые допущения в приближённые оценки среднего
  и пикового RPS, пропускной способности и объёма хранения, явно показывая формулы,
  единицы измерения и запас, достаточный для выбора архитектурного направления.

  '
estimated_minutes: 25
concepts:
- порядок величины и явные допущения
- средний и пиковый RPS
- соотношение чтений и записей
- пропускная способность сети
- объём хранения и рост данных
- запас ёмкости и проверка узких мест
study_focus:
- Какие исходные продуктовые величины нужны, чтобы оценить средний и пиковый RPS?
- Как из числа операций и размера объекта получить требования к сети и хранению, не
  потеряв единицы измерения?
- Почему приблизительная оценка с явными допущениями полезнее ложной точности и как
  по ней выбирать архитектурное направление?
practice:
  type: exercise
  goal: 'Для заданного сервиса оценить средний и пиковый read/write RPS, суточный
    сетевой трафик и годовой объём хранения, объяснить допущения и назвать вероятное
    узкое место или решение, которое расчёт позволяет принять.

    '
verification:
  recall:
    enabled: true
  understanding:
    enabled: true
  application:
    enabled: true
