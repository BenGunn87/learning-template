format_version: 1
id: frame-a-system-design-problem
title: Frame a system design problem
nodes:
- design-process
- requirements-analysis
- functional-nonfunctional-requirements
- tradeoff-analysis
goal: 'Уметь за первые минуты System Design задачи превратить размытое описание продукта
  в явные границы системы, приоритетные пользовательские сценарии, измеримые качественные
  требования и зафиксированные компромиссы.

  '
estimated_minutes: 25
concepts:
- границы и scope системы
- функциональные требования и ключевые сценарии
- измеримые нефункциональные требования
- ограничения и допущения
- приоритизация требований и архитектурные компромиссы
study_focus:
- Как отделить обязательные пользовательские сценарии от возможностей вне scope?
- Как превратить слова «быстро», «надёжно» и «масштабируемо» в проверяемые требования?
- Как требования и ограничения помогают обосновать архитектурный компромисс?
practice:
  type: scenario
  goal: 'Сформировать краткий design brief для сервиса сокращения ссылок: уточнить
    scope, выделить основные сценарии, задать измеримые качественные требования и
    назвать один осознанный компромисс.

    '
verification:
  recall:
    enabled: true
  understanding:
    enabled: true
  application:
    enabled: true
