format_version: 1
id: model-data-and-access-patterns
title: Model data and access patterns
nodes:
- data-modeling
- transactions
- sql-and-nosql
goal: 'Уметь выводить сущности, ключевые запросы, границы атомарных изменений и требования
  к согласованности из пользовательских сценариев, а затем выбирать подход к хранению
  по этим требованиям, а не по ярлыку SQL или NoSQL.

  '
estimated_minutes: 25
concepts:
- сущности, связи и инварианты
- паттерны чтения и записи
- первичные ключи и направления доступа
- границы транзакции и атомарности
- требования к согласованности
- компромиссы реляционной и нереляционной моделей
study_focus:
- Какие сценарии чтения и записи должны определять форму модели данных?
- Какие инварианты требуют атомарной транзакции, а где допустима асинхронная согласованность?
- Как сравнивать SQL и NoSQL по конкретным паттернам доступа и гарантиям, не сводя
  выбор к категории хранилища?
practice:
  type: scenario
  goal: 'Для сервиса оформления заказов выделить сущности, основные паттерны чтения
    и записи, границы транзакций и допустимые задержки согласования, после чего обосновать
    модель данных и класс хранилища через требования и компромиссы.

    '
verification:
  recall:
    enabled: true
  understanding:
    enabled: true
  application:
    enabled: true
