format_version: 1
id: replicate-data-across-nodes
title: Replicate data across nodes
nodes:
- replication
- leader-follower-replication
goal: Объяснить, зачем реплицировать данные, как работает запись через leader и чтение
  с followers, сравнить синхронное и асинхронное подтверждение записи, а также разобрать
  влияние lag и failover на доступность и сохранность данных.
estimated_minutes: 25
concepts:
- копии данных для чтения и отказоустойчивости
- leader и followers, поток записи и подтверждение
- синхронная и асинхронная репликация
- replication lag и устаревшее чтение
- failover и потеря подтверждённой записи
- разница между репликацией и резервной копией
study_focus:
- Что именно должно произойти с записью до ответа клиенту при синхронной и асинхронной
  репликации?
- Как отставание follower проявляется для клиента и какие операции особенно чувствительны
  к нему?
- Что может случиться с последней подтверждённой записью при отказе leader и как выбранный
  режим меняет риск?
practice:
  type: scenario
  goal: Для сервиса с частыми чтениями и критичными записями выбрать схему leader-follower,
    режим подтверждения и маршрут чтений; объяснить поведение при lag и отказе leader,
    а также цену выбранных гарантий.
verification:
  recall:
    enabled: true
  understanding:
    enabled: true
  application:
    enabled: true
